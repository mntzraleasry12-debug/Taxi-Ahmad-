<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تاكسي بسيط</title>
    <style>
        /* تصميم بسيط ونظيف */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 350px;
            text-align: center;
        }
        h2 { color: #333; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #ffc400; /* لون التاكسي الأصفر */
            color: #000;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { background-color: #e0ac00; }
        
        /* شاشة الحالة (مخفية في البداية) */
        #status-screen { display: none; }
        
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ffc400;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .driver-info {
            background: #f9f9f9;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        .driver-info h3 { margin: 0 0 10px 0; color: #16c784; }
        .driver-info p { margin: 5px 0; color: #555; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الشاشة الأولى: طلب التاكسي -->
        <div id="request-screen">
            <h2>🚖 اطلب تاكسي</h2>
            <input type="text" id="destination" placeholder="إلى أين تريد الذهاب؟">
            <button onclick="orderTaxi()">اطلب الآن</button>
        </div>

        <!-- الشاشة الثانية: حالة الطلب -->
        <div id="status-screen">
            <h2>جاري البحث...</h2>
            <div class="loader" id="loading-spinner"></div>
            <p id="status-text">نبحث لك عن أقرب سائق، يرجى الانتظار...</p>
            
            <!-- معلومات السائق تظهر بعد ثواني -->
            <div class="driver-info" id="driver-info">
                <h3>✅ تم قبول طلبك!</h3>
                <p><b>السائق:</b> أحمد محمد</p>
                <p><b>السيارة:</b> تويوتا كورولا (بيضاء)</p>
                <p><b>رقم اللوحة:</b> 12345 بغداد</p>
                <button onclick="resetApp()" style="margin-top: 15px; background-color: #d94444; color: white;">إلغاء الرحلة</button>
            </div>
        </div>
    </div>

    <script>
        function orderTaxi() {
            var dest = document.getElementById("destination").value;
            
            // التحقق من أن المستخدم كتب وجهة
            if(dest === "") {
                alert("يرجى كتابة الوجهة أولاً!");
                return;
            }

            // إخفاء شاشة الطلب وإظهار شاشة الانتظار
            document.getElementById("request-screen").style.display = "none";
            document.getElementById("status-screen").style.display = "block";

            // محاكاة البحث عن سائق (ننتظر 3 ثواني ثم يظهر السائق)
            setTimeout(function() {
                document.getElementById("loading-spinner").style.display = "none";
                document.getElementById("status-text").style.display = "none";
                document.getElementById("driver-info").style.display = "block";
            }, 3000); // 3000 ملي ثانية = 3 ثواني
        }

        function resetApp() {
            // إعادة التطبيق لحالته الأولى (لإلغاء الرحلة)
            document.getElementById("destination").value = "";
            document.getElementById("request-screen").style.display = "block";
            document.getElementById("status-screen").style.display = "none";
            document.getElementById("loading-spinner").style.display = "block";
            document.getElementById("status-text").style.display = "block";
            document.getElementById("driver-info").style.display = "none";
        }
    </script>

</body>
</html>
