<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#FFC107">
    <title>تكسي أحمد - Premium Ride</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Map Library -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* =========================================================
           1. GLOBAL VARIABLES & RESET
           ========================================================= */
        :root {
            /* Brand Colors */
            --primary: #FFC107;
            --primary-dark: #FFA000;
            --primary-light: #FFF8E1;
            
            /* UI Colors */
            --bg-body: #121212;
            --bg-app: #F8F9FA;
            --white: #FFFFFF;
            --dark: #1A1A1A;
            --text-main: #222222;
            --text-muted: #777777;
            --border-color: #EEEEEE;
            
            /* Status Colors */
            --success: #00C853;
            --danger: #FF3B30;
            --info: #2196F3;
            
            /* Shadows */
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
            --shadow-md: 0 6px 16px rgba(0,0,0,0.1);
            --shadow-lg: 0 12px 32px rgba(0,0,0,0.15);
            --shadow-glow: 0 0 20px rgba(255, 193, 7, 0.4);
            
            /* Radius */
            --radius-sm: 12px;
            --radius-md: 20px;
            --radius-lg: 32px;
            --radius-round: 50%;
            
            /* Transitions */
            --transition-fast: 0.2s ease;
            --transition-normal: 0.3s ease;
            --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Tajawal', sans-serif;
            user-select: none;
        }

        html, body {
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* =========================================================
           2. APP CONTAINER (Phone Frame)
           ========================================================= */
        .app-container {
            width: 100%;
            max-width: 430px; /* iPhone 14 Pro Max width */
            height: 100%;
            max-height: 932px;
            background-color: var(--bg-app);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        /* For Desktop viewing */
        @media (min-width: 500px) {
            .app-container {
                height: 90vh;
                border-radius: 40px;
                border: 10px solid #333;
            }
        }

        /* =========================================================
           3. LOGIN SCREEN
           ========================================================= */
        #login-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10000;
            background: linear-gradient(145deg, #111111 0%, #222222 100%);
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.85, 0, 0.15, 1);
        }

        #login-screen.slide-up {
            transform: translateY(-100%);
        }

        /* Decorative Glows */
        .glow-1 {
            position: absolute;
            top: -50px;
            right: -50px;
            width: 250px;
            height: 250px;
            background: var(--primary);
            filter: blur(100px);
            opacity: 0.2;
            border-radius: 50%;
        }

        .glow-2 {
            position: absolute;
            bottom: -50px;
            left: -50px;
            width: 200px;
            height: 200px;
            background: var(--primary-dark);
            filter: blur(100px);
            opacity: 0.15;
            border-radius: 50%;
        }

        .login-branding {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 2;
        }

        /* Animated Taxi Logo */
        .logo-icon {
            font-size: 70px;
            color: var(--primary);
            margin-bottom: 20px;
            animation: floatTaxi 3s ease-in-out infinite;
            text-shadow: 0 10px 20px rgba(255, 193, 7, 0.3);
        }

        @keyframes floatTaxi {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .login-title {
            font-size: 48px;
            font-weight: 900;
            color: var(--white);
            letter-spacing: -1px;
        }

        .login-title span {
            color: var(--primary);
        }

        .login-subtitle {
            font-size: 16px;
            color: #999;
            margin-top: 5px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* Login Form Container */
        .login-form-container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 40px 40px 0 0;
            padding: 35px 30px;
            position: relative;
            z-index: 3;
            padding-bottom: calc(35px + env(safe-area-inset-bottom));
        }

        /* Role Toggle */
        .role-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 16px;
            padding: 6px;
            margin-bottom: 30px;
            position: relative;
        }

        .role-tab {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            z-index: 2;
            transition: color 0.3s;
        }

        .role-tab.active {
            color: var(--dark);
        }

        /* Sliding Background for Tabs */
        .role-tab-bg {
            position: absolute;
            top: 6px;
            right: 6px;
            width: calc(50% - 6px);
            height: calc(100% - 12px);
            background: var(--primary);
            border-radius: 12px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
        }

        .role-tab-bg.driver {
            transform: translateX(calc(-100%));
        }

        /* Inputs */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 18px;
            transition: color 0.3s;
        }

        .input-group input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--white);
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.3s;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .input-group input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.5);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.1);
        }

        .btn-login {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: var(--dark);
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(255, 193, 7, 0.35);
            transition: transform 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-login:active {
            transform: scale(0.96);
        }

        /* =========================================================
           4. SCREENS (Customer & Driver)
           ========================================================= */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            background: var(--bg-app);
            z-index: 100;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* =========================================================
           5. CUSTOMER DASHBOARD
           ========================================================= */
        #customer-screen {
            background: var(--white);
            position: relative;
        }

        /* Floating Header */
        .customer-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            padding-top: calc(20px + env(safe-area-inset-top));
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 1000;
            pointer-events: none; /* Let clicks pass through to map */
        }

        .header-logo {
            font-size: 26px;
            font-weight: 900;
            color: var(--dark);
            text-shadow: 0 2px 10px rgba(255,255,255,0.9);
            pointer-events: auto;
        }

        .header-logo span {
            color: var(--primary-dark);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }

        .icon-btn {
            width: 46px;
            height: 46px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-md);
            font-size: 18px;
            color: var(--dark);
            cursor: pointer;
            position: relative;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--danger);
            color: var(--white);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--white);
        }

        /* Map */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #e5e3df;
        }

        /* Custom Leaflet Marker */
        .custom-marker {
            background-color: var(--primary);
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 3px solid var(--white);
            box-shadow: 0 0 15px rgba(255, 193, 7, 0.8);
            animation: pulseMarker 2s infinite;
        }

        @keyframes pulseMarker {
            0% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(255, 193, 7, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 193, 7, 0); }
        }

        /* Location Card Overlay */
        .location-card {
            position: absolute;
            top: 85px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            padding: 12px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow-md);
            z-index: 10;
            width: 88%;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .location-card:active {
            transform: translateX(-50%) scale(0.97);
        }

        .location-card i.fa-location-dot {
            font-size: 22px;
            color: var(--dark);
        }

        .location-info {
            flex: 1;
        }

        .location-info h4 {
            font-size: 15px;
            font-weight: 800;
            color: var(--dark);
        }

        .location-info p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .location-card i.fa-chevron-left {
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Bottom Sheet */
        .customer-bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            border-radius: 35px 35px 0 0;
            padding: 20px;
            padding-bottom: calc(85px + env(safe-area-inset-bottom));
            z-index: 100;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.08);
        }

        /* Drag Handle */
        .sheet-handle {
            width: 40px;
            height: 5px;
            background: #E0E0E0;
            border-radius: 10px;
            margin: 0 auto 20px;
        }

        /* Services Grid */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .service-card {
            background: var(--white);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            padding: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }

        .service-card:active {
            transform: scale(0.96);
            background: #F9F9F9;
        }

        .service-badge {
            position: absolute;
            top: -8px;
            right: 50%;
            transform: translateX(50%);
            background: var(--primary);
            color: var(--dark);
            font-size: 9px;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 10px;
            letter-spacing: 1px;
        }

        .service-img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .service-icon {
            width: 50px;
            height: 50px;
            background: var(--primary-light);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            color: var(--primary-dark);
        }

        .service-text h4 {
            font-size: 14px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 2px;
        }

        .service-text p {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* Promo Banner */
        .promo-banner {
            background: var(--dark);
            border-radius: 18px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            height: 90px;
        }

        .banner-shape {
            position: absolute;
            left: 0;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary) 0%, var(--primary-dark) 100%);
            clip-path: polygon(0 0, 100% 0, 75% 100%, 0 100%);
            z-index: 1;
        }

        .banner-content {
            position: relative;
            z-index: 2;
            color: var(--white);
            text-align: right;
            margin-right: auto;
        }

        .banner-content h3 {
            font-size: 16px;
            font-weight: 800;
            line-height: 1.4;
        }

        .banner-content span {
            color: var(--primary);
        }

        .banner-content p {
            font-size: 11px;
            color: #AAA;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .banner-skyline {
            position: relative;
            z-index: 2;
            font-size: 45px;
            color: rgba(255,255,255,0.08);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            padding-bottom: calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--border-color);
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.3s;
            background: none;
            border: none;
            cursor: pointer;
        }

        .nav-item i {
            font-size: 22px;
        }

        .nav-item.active {
            color: var(--primary-dark);
        }

        .nav-item:active {
            transform: scale(0.9);
        }

        /* =========================================================
           6. DRIVER DASHBOARD
           ========================================================= */
        #driver-screen {
            background: #0F0F0F;
            color: var(--white);
        }

        .driver-header {
            padding: 30px 20px;
            padding-top: calc(30px + env(safe-area-inset-top));
            background: linear-gradient(180deg, #1A1A1A 0%, #0F0F0F 100%);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 30px 30px;
        }

        .driver-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .driver-avatar {
            width: 50px;
            height: 50px;
            background: #333;
