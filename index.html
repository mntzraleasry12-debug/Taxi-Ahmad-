<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تكسي أحمد</title>
    
    <!-- خط تجوال -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <!-- أيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- مكتبة الخريطة الحقيقية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        :root {
            --primary-yellow: #F5BD25;
            --primary-yellow-dark: #E5A916;
            --dark: #121212;
            --bg: #F8F9FA;
            --white: #FFFFFF;
            --gray: #6C757D;
            --border: #EAEAEA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* حاوية التطبيق (مقاس الهاتف) */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background: var(--white);
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        /* ================= شاشة تسجيل الدخول ================= */
        #login-screen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 100;
            background: var(--white);
            transition: transform 0.4s ease;
        }

        .login-header {
            text-align: center;
            padding: 30px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(to bottom, #f9f9f9, #ffffff);
        }

        .brand-logo {
            font-size: 38px;
            font-weight: 900;
            color: var(--dark);
            margin-bottom: 5px;
        }
        .brand-logo span { color: var(--primary-yellow); }
        
        .brand-subtitle {
            color: var(--gray);
            font-size: 14px;
            margin-bottom: 20px;
            font-weight: 700;
        }

        .car-img {
            width: 85%;
            max-width: 300px;
            margin-bottom: 20px;
            filter: drop-shadow(0 15px 10px rgba(0,0,0,0.15));
        }

        /* صندوق تسجيل الدخول */
        .login-box {
            background: var(--white);
            border-radius: 30px 30px 0 0;
            padding: 25px 20px 40px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            position: relative;
            z-index: 2;
        }

        /* اختيار نوع الحساب (زبون / سائق) */
        .role-selector {
            display: flex;
            background: #f0f2f5;
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-btn.active {
            background: var(--white);
            color: var(--dark);
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* حقول الإدخال */
        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray);
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 15px;
            background: #FAFAFA;
            outline: none;
            transition: border 0.3s;
        }

        .input-group input:focus {
            border-color: var(--primary-yellow);
            background: var(--white);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: var(--primary-yellow);
            color: var(--dark);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 6px 15px rgba(245, 189, 37, 0.3);
            transition: transform 0.2s;
        }
        .btn-login:active { transform: scale(0.97); }

        /* ================= الواجهات بعد الدخول ================= */
        .dashboard {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            flex-direction: column;
            background: var(--bg);
        }

        .dashboard.active {
            display: flex;
        }

        /* --- واجهة الزبون --- */
        #customer-dashboard {
            background: #fff;
        }

        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* بطاقة طلب التاكسي */
        .request-card {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            border-radius: 25px 25px 0 0;
            padding: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .location-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .location-icon {
            width: 40px;
            height: 40px;
            background: #f0f2f5;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--dark);
        }

        .location-text h3 {
            font-size: 16px;
            color: var(--dark);
            margin-bottom: 3px;
        }

        .location-text p {
            font-size: 13px;
            color: var(--gray);
        }

        .btn-request {
            width: 100%;
            padding: 16px;
            background: var(--primary-yellow);
            color: var(--dark);
            border: none;
            border-radius: 15px;
            font-size: 18px;
            font-weight: 800;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        /* --- واجهة السائق --- */
        #driver-dashboard {
            background: #f8f9fa;
        }

        .driver-header {
            background: var(--dark);
            color: var(--white);
            padding: 30px 20px;
            border-radius: 0 0 25px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .driver-profile h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .driver-profile p {
            font-size: 13px;
            color: #aaa;
        }

        .status-switch {
            width: 60px;
            height: 32px;
            background: #444;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        .status-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--white);
            border-radius: 50%;
            top: 4px;
            right: 4px;
            transition: 0.3s;
        }

        .status-switch.on {
            background: #13a878;
        }

        .status-switch.on::after {
            right: 32px;
        }

        .driver-content {
            padding: 20px;
        }

        .stat-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: var(--white);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .stat-card h4 {
            font-size: 13px;
            color: var(--gray);
            margin-bottom: 8px;
        }

        .stat-card h2 {
            font-size: 22px;
            color: var(--dark);
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .request-item {
            background: var(--white);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
        }

        .request-item-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .request-item-header .price {
            color: #13a878;
        }

        .request-item p {
            font-size: 14px;
            color: var(--gray);
            margin-bottom: 5px;
        }

        .btn-accept {
            width: 100%;
            padding: 12px;
            background: var(--dark);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-weight: 700;
            margin-top: 10px;
            cursor: pointer;
        }

    </style>
</head>
<body>

    <div class="app-container">

        <!-- 1. شاشة تسجيل الدخول -->
        <div id="login-screen">
            <div class="login-header">
                <div class="brand-logo">تكسي <span>أحمد</span></div>
                <div class="brand-subtitle">أسرع .. آمن .. أوصلك بكل سهولة</div>
                <!-- صورة سيارة تاكسي شفافة -->
                <img src="https://www.pngmart.com/files/22/Taxi-Transparent-Images.png" alt="Taxi" class="car-img">
            </div>

            <div class="login-box">
                <!-- اختيار نوع الحساب -->
                <div class="role-selector">
                    <button class="role-btn active" id="btn-customer" onclick="selectRole('customer')">زبون</button>
                    <button class="role-btn" id="btn-driver" onclick="selectRole('driver')">سائق</button>
                </div>

                <!-- رقم الهاتف -->
                <div class="input-group">
                    <i class="fa-solid fa-phone"></i>
                    <input type="tel" id="phone" placeholder="رقم الهاتف">
                </div>

                <!-- كلمة المرور -->
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="كلمة المرور">
                </div>

                <!-- زر الدخول -->
                <button class="btn-login" onclick="login()">تسجيل الدخول</button>
            </div>
        </div>

        <!-- 2. واجهة الزبون -->
        <div id="customer-dashboard" class="dashboard">
            <div id="map"></div>
            
            <div class="request-card">
                <div class="location-info">
                    <div class="location-icon"><i class="fa-solid fa-location-dot"></i></div>
                    <div class="location-text">
                        <h3>موقعك الحالي</h3>
                        <p id="current-location">جاري تحديد الموقع...</p>
                    </div>
                </div>
                <button class="btn-request" onclick="requestTaxi()">
                    <span>اطلب تاكسي الأن</span>
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>
        </div>

        <!-- 3. واجهة السائق -->
        <div id="driver-dashboard" class="dashboard">
            <div class="driver-header">
                <div class="driver-profile">
                    <h2>مرحباً، أحمد</h2>
                    <p id="driver-status-text">أنت غير متصل</p>
                </div>
                <div class="status-switch" id="driver-switch" onclick="toggleDriverStatus()"></div>
            </div>

            <div class="driver-content">
                <div class="stat-cards">
                    <div class="stat-card">
                        <h4>أرباح اليوم</h4>
                        <h2>0 د.ع</h2>
                    </div>
                    <div class="stat-card">
                        <h4>الرحلات</h4>
                        <h2>0</h2>
                    </div>
                </div>

                <div class="section-title">طلبات الرحلات</div>

                <div id="requests-container">
                    <!-- طلبات وهمية تظهر للسائق -->
                    <div class="request-item">
                        <div class="request-item-header">
                            <span>رحلة جديدة</span>
                            <span class="price">5,000 د.ع</span>
                        </div>
                        <p><i class="fa-solid fa-location-dot"></i> من: شارع الحبوبي</p>
                        <p><i class="fa-solid fa-flag-checkered"></i> إلى: مستشفى الحسين</p>
                        <button class="btn-accept" onclick="acceptRide(this)">قبول الرحلة</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- مكتبة الخريطة -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        let currentRole = 'customer'; // customer or driver
        let map = null;
        let driverOnline = false;

        // 1. دالة اختيار نوع الحساب
        function selectRole(role) {
            currentRole = role;
            document.getElementById('btn-customer').classList.toggle('active', role === 'customer');
            document.getElementById('btn-driver').classList.toggle('active', role === 'driver');
        }

        // 2. دالة تسجيل الدخول
        function login() {
            const phone = document.getElementById('phone').value;
            const pass = document.getElementById('password').value;

            if (!phone || !pass) {
                alert('الرجاء إدخال رقم الهاتف وكلمة المرور');
                return;
            }

            // إخفاء شاشة الدخول
            document.getElementById('login-screen').style.transform = 'translateY(100%)';

            if (currentRole === 'customer') {
                // إظهار واجهة الزبون
                document.getElementById('customer-dashboard').classList.add('active');
                // تشغيل الخريطة بعد ظهور الشاشة
                setTimeout(initMap, 300); 
            } else {
                // إظهار واجهة السائق
                document.getElementById('driver-dashboard').classList.add('active');
            }
        }

        // 3. دالة تشغيل الخريطة الحقيقية (Leaflet)
        function initMap() {
            if (map) return; // إذا كانت شغالة لا تعيد تشغيلها

            // إحداثيات افتراضية (الناصرية)
            map = L.map('map').setView([31.043, 46.257], 14);

            // تصميم الخريطة
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; OpenStreetMap'
            }).addTo(map);

            // إضافة علامة (Marker)
            L.marker([31.043, 46.257]).addTo(map)
                .bindPopup('موقعك الحالي')
                .openPopup();

            // تحديث النص بالموقع
            document.getElementById('current-location').innerText = 'الناصرية - ذي قار';

            // محاولة جلب موقع المستخدم الحقيقي
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(position => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 15);
                    L.marker([lat, lng]).addTo(map).bindPopup('أنت هنا').openPopup();
                    document.getElementById('current-location').innerText = 'تم تحديد موقعك';
                });
            }
        }

        // 4. دالة طلب تاكسي للزبون
        function requestTaxi() {
            alert('جاري البحث عن سائق قريب منك...');
        }

        // 5. دالة تغيير حالة السائق (متصل / غير متصل)
        function toggleDriverStatus() {
            driverOnline = !driverOnline;
            const switchEl = document.getElementById('driver-switch');
            const statusText = document.getElementById('driver-status-text');
            
            switchEl.classList.toggle('on', driverOnline);
            statusText.innerText = driverOnline ? 'أنت متصل الآن (تستقبل طلبات)' : 'أنت غير متصل';
            
            if (driverOnline) {
                alert('تم تفعيل وضع السائق! ستصلك طلبات الرحلات.');
            }
        }

        // 6. دالة قبول الرحلة للسائق
        function acceptRide(btn) {
            if (!driverOnline) {
                alert('يجب تفعيل زر (متصل) أولاً لتستقبل الطلبات!');
                return;
            }
            btn.innerText = 'تم القبول (جاري التوجه)';
            btn.style.background = '#13a878';
            btn.disabled = true;
            alert('تم قبول الرحلة، توجه إلى موقع الزبون.');
        }
    </script>
</body>
</html>
