<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تكسي أحمد - فخامة</title>
    
    <!-- خط Tajawal الفخم -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;800;900&display=swap" rel="stylesheet">
    
    <!-- مكتبة Leaflet للخرائط المجانية -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Firebase SDK (الإصدار 9 المتوافق مع المتصفحات) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ⚠️⚠️⚠️ استبدل هذا الكائن بإعدادات Firebase الخاصة بك ⚠️⚠️⚠️
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // تهيئة Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        // جعل المتغيرات متاحة عالمياً لاستخدامها في السكريبت الرئيسي
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firebaseSignOut = () => signOut(auth);
        window.firebaseSignIn = signInWithEmailAndPassword;
        window.firebaseSignUp = createUserWithEmailAndPassword;
        window.firebaseOnAuth = onAuthStateChanged;
        window.firebaseSet = set;
        window.firebaseRef = ref;
        window.firebaseOnValue = onValue;
        
        // إخفاء شاشة التحميل بعد تهيئة Firebase
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('auth-screen').style.display = 'flex';
        
        // التحقق من حالة تسجيل الدخول عند بدء التشغيل (ميزة البقاء مسجلاً)
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // المستخدم مسجل دخوله بالفعل -> تخطي شاشة الدخول
                showMainApp(user);
            } else {
                // المستخدم غير مسجل -> إظهار شاشة الدخول
                document.getElementById('auth-screen').style.display = 'flex';
                document.getElementById('main-app').style.display = 'none';
            }
        });
        
        window.showMainApp = showMainApp;
    </script>

    <style>
        /* التصميم الفخم (نفس النمط السابق مع تحسينات) */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
        body { background: #0b0a0f; color: #eee; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 10px; }
        
        .phone-frame { max-width: 430px; width: 100%; background: linear-gradient(145deg, #14121a 0%, #1a1722 100%); border-radius: 50px; padding: 20px 18px; box-shadow: 0 30px 80px rgba(0,0,0,0.9), 0 0 0 2px rgba(212, 175, 55, 0.15); border: 1px solid rgba(212, 175, 55, 0.3); position: relative; overflow: hidden; min-height: 600px; }
        
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 215, 0, 0.1); border-radius: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }

        /* شاشة التحميل */
        #loading-screen { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; color: #f5d472; }
        .spinner { width: 50px; height: 50px; border: 3px solid rgba(245, 212, 114, 0.3); border-top-color: #f5d472; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* شاشة تسجيل الدخول / إنشاء حساب */
        #auth-screen { display: none; flex-direction: column; height: 100%; padding-top: 40px; }
        #auth-screen h2 { text-align: center; color: #f5d472; font-size: 28px; margin-bottom: 30px; font-weight: 900; }
        .auth-tabs { display: flex; justify-content: center; gap: 15px; margin-bottom: 30px; }
        .auth-tab { padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: 700; color: #7a7a8a; border: 1px solid rgba(255,215,0,0.1); transition: 0.3s; }
        .auth-tab.active { background: rgba(212, 175, 55, 0.15); color: #f5d472; border-color: #b8860b; }
        .auth-form { display: flex; flex-direction: column; gap: 15px; }
        .auth-form input { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,215,0,0.15); border-radius: 50px; padding: 15px 20px; color: #fff; font-size: 16px; outline: none; transition: 0.3s; }
        .auth-form input:focus { border-color: #f5d472; box-shadow: 0 0 15px rgba(212, 175, 55, 0.2); }
        .auth-btn { background: linear-gradient(135deg, #f5d472, #b8860b); color: #0b0a0f; border: none; border-radius: 50px; padding: 15px; font-size: 18px; font-weight: 800; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        .auth-btn:active { transform: scale(0.97); }
        .auth-error { color: #ff6b6b; text-align: center; font-size: 14px; margin-top: 10px; }

        /* التطبيق الرئيسي */
        #main-app { display: none; height: 100%; flex-direction: column; }
        
        /* رأس التطبيق */
        .app-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px 15px 5px; }
        .app-header h1 { font-size: 24px; font-weight: 900; background: linear-gradient(135deg, #f5d472, #b8860b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .app-header .user-info { display: flex; align-items: center; gap: 10px; }
        .app-header .user-info span { color: #aaa; font-size: 12px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; }
        .app-header .logout-btn { background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.2); color: #f5d472; padding: 8px 12px; border-radius: 50px; cursor: pointer; font-size: 14px; }

        /* الخريطة */
        #map-container { height: 250px; border-radius: 25px; margin-bottom: 20px; overflow: hidden; border: 1px solid rgba(255,215,0,0.2); position: relative; z-index: 1; }
        #map { width: 100%; height: 100%; }
        .map-overlay { position: absolute; bottom: 10px; left: 10px; right: 10px; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); border-radius: 15px; padding: 12px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border: 1px solid rgba(255,215,0,0.2); }
        .map-overlay p { color: #f5d472; font-weight: 700; font-size: 14px; }
        .map-overlay button { background: linear-gradient(135deg, #f5d472, #b8860b); border: none; padding: 8px 20px; border-radius: 50px; font-weight: 800; cursor: pointer; color: #0b0a0f; }

        /* أزرار الخدمات السريعة */
        .quick-actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px; }
        .action-item { background: rgba(255,255,255,0.02); backdrop-filter: blur(10px); border: 1px solid rgba(255,215,0,0.06); border-radius: 20px; padding: 15px 8px; text-align: center; cursor: pointer; transition: 0.3s; }
        .action-item:active { transform: scale(0.95); background: rgba(212, 175, 55, 0.08); border-color: #b8860b; }
        .action-item i { font-size: 26px; color: #f5d472; margin-bottom: 8px; display: block; }
        .action-item span { color: #cfcfdf; font-size: 12px; font-weight: 700; display: block; }
        
        /* تذييل بسيط */
        .footer-note { text-align: center; color: #4d5d7a; font-size: 11px; margin-top: auto; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.03); }
    </style>
</head>
<body>

<div class="phone-frame">
    
    <!-- شاشة التحميل -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>جاري تحميل تكسي أحمد...</p>
    </div>

    <!-- شاشة تسجيل الدخول / إنشاء حساب -->
    <div id="auth-screen">
        <h2>🚖 تكسي أحمد</h2>
        <div class="auth-tabs">
            <div class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">دخول</div>
            <div class="auth-tab" id="tab-signup" onclick="switchAuthTab('signup')">حساب جديد</div>
        </div>
        <div class="auth-form" id="form-login">
            <input type="email" id="login-email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="login-password" placeholder="كلمة المرور" required>
            <button class="auth-btn" onclick="handleLogin()">تسجيل الدخول</button>
            <div class="auth-error" id="login-error"></div>
        </div>
        <div class="auth-form" id="form-signup" style="display:none;">
            <input type="text" id="signup-name" placeholder="الاسم الكامل" required>
            <input type="email" id="signup-email" placeholder="البريد الإلكتروني" required>
            <input type="password" id="signup-password" placeholder="كلمة المرور (6 أحرف على الأقل)" required>
            <button class="auth-btn" onclick="handleSignup()">إنشاء حساب</button>
            <div class="auth-error" id="signup-error"></div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="main-app">
        <div class="app-header">
            <h1>🚖 تكسي أحمد</h1>
            <div class="user-info">
                <span id="user-email-display"></span>
                <button class="logout-btn" onclick="handleLogout()">خروج</button>
            </div>
        </div>

        <!-- الخريطة -->
        <div id="map-container">
            <div id="map"></div>
            <div class="map-overlay">
                <p><i>📍</i> موقعك الحالي</p>
                <button onclick="requestTaxi()">اطلب تكسي الآن</button>
            </div>
        </div>

        <!-- خدمات سريعة -->
        <div class="quick-actions">
            <div class="action-item" onclick="requestTaxi()"><i class="fas fa-taxi"></i><span>طلب تكسي</span></div>
            <div class="action-item" onclick="showMyRequests()"><i class="fas fa-history"></i><span>طلباتي</span></div>
            <div class="action-item" onclick="showProfile()"><i class="fas fa-user"></i><span>حسابي</span></div>
        </div>

        <div class="footer-note">
            <i>✨</i> تكسي أحمد - الفخامة في كل رحلة <i>✨</i>
        </div>
    </div>

</div>

<script>
    // ==================== دوال واجهة المستخدم ====================
    function switchAuthTab(tab) {
        document.getElementById('form-login').style.display = tab === 'login' ? 'flex' : 'none';
        document.getElementById('form-signup').style.display = tab === 'signup' ? 'flex' : 'none';
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
        document.getElementById('login-error').textContent = '';
        document.getElementById('signup-error').textContent = '';
    }

    function handleLogin() {
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const errorEl = document.getElementById('login-error');
        errorEl.textContent = '';
        
        if (!email || !password) {
            errorEl.textContent = 'يرجى إدخال البريد الإلكتروني وكلمة المرور.';
            return;
        }
        
        window.firebaseSignIn(window.firebaseAuth, email, password)
            .then((userCredential) => {
                // تم تسجيل الدخول بنجاح - Firebase يحفظ الجلسة تلقائياً
                showMainApp(userCredential.user);
            })
            .catch((error) => {
                errorEl.textContent = 'خطأ: ' + error.message;
            });
    }

    function handleSignup() {
        const name = document.getElementById('signup-name').value.trim();
        const email = document.getElementById('signup-email').value.trim();
        const password = document.getElementById('signup-password').value;
        const errorEl = document.getElementById('signup-error');
        errorEl.textContent = '';
        
        if (!name || !email || !password) {
            errorEl.textContent = 'يرجى ملء جميع الحقول.';
            return;
        }
        if (password.length < 6) {
            errorEl.textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
            return;
        }
        
        window.firebaseSignUp(window.firebaseAuth, email, password)
            .then((userCredential) => {
                // حفظ بيانات المستخدم الإضافية (الاسم) في قاعدة البيانات
                window.firebaseSet(window.firebaseRef(window.firebaseDb, 'users/' + userCredential.user.uid), {
                    name: name,
                    email: email,
                    createdAt: new Date().toISOString()
                });
                showMainApp(userCredential.user);
            })
            .catch((error) => {
                errorEl.textContent = 'خطأ: ' + error.message;
            });
    }

    function handleLogout() {
        window.firebaseSignOut().then(() => {
            document.getElementById('main-app').style.display = 'none';
            document.getElementById('auth-screen').style.display = 'flex';
            // مسح حقول الإدخال
            document.getElementById('login-email').value = '';
            document.getElementById('login-password').value = '';
        });
    }

    // ==================== دالة عرض التطبيق الرئيسي ====================
    function showMainApp(user) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-app').style.display = 'flex';
        document.getElementById('user-email-display').textContent = user.email;
        
        // تهيئة الخريطة بعد ظهور الحاوية
        initMap();
    }

    // ==================== الخريطة (Leaflet) ====================
    let map;
    let userMarker;
    
    function initMap() {
        if (map) return; // منع التهيئة المزدوجة
        
        // إحداثيات افتراضية (بغداد كمثال)
        map = L.map('map').setView([33.3152, 44.3661], 13);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 19
        }).addTo(map);
        
        // محاولة تحديد موقع المستخدم
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    map.setView([lat, lng], 15);
                    
                    if (userMarker) map.removeLayer(userMarker);
                    userMarker = L.marker([lat, lng]).addTo(map)
                        .bindPopup('موقعك الحالي').openPopup();
                },
                (error) => {
                    console.warn('تعذر تحديد الموقع:', error.message);
                }
            );
        }
    }

    // ==================== طلب تكسي (حفظ في قاعدة البيانات) ====================
    function requestTaxi() {
        const user = window.firebaseAuth.currentUser;
        if (!user) {
            alert('يجب تسجيل الدخول أولاً.');
            return;
        }
        
        // تحديد موقع المستخدم (أو استخدام الموقع الافتراضي)
        let lat = 33.3152, lng = 44.3661;
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((pos) => {
                lat = pos.coords.latitude;
                lng = pos.coords.longitude;
                saveTaxiRequest(user, lat, lng);
            }, () => {
                saveTaxiRequest(user, lat, lng); // استخدام الافتراضي عند الفشل
            });
        } else {
            saveTaxiRequest(user, lat, lng);
        }
    }

    function saveTaxiRequest(user, lat, lng) {
        const requestId = 'req_' + Date.now();
        window.firebaseSet(window.firebaseRef(window.firebaseDb, 'requests/' + requestId), {
            userId: user.uid,
            userEmail: user.email,
            lat: lat,
            lng: lng,
            status: 'pending',
            timestamp: new Date().toISOString()
        }).then(() => {
            alert('✅ تم إرسال طلبك بنجاح! سيتواصل معك السائق قريباً.');
        }).catch((error) => {
            alert('❌ حدث خطأ: ' + error.message);
        });
    }

    function showMyRequests() {
        const user = window.firebaseAuth.currentUser;
        if (!user) return;
        
        window.firebaseOnValue(window.firebaseRef(window.firebaseDb, 'requests/'), (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                alert('لا توجد طلبات سابقة.');
                return;
            }
            let userRequests = Object.values(data).filter(r => r.userId === user.uid);
            if (userRequests.length === 0) {
                alert('لا توجد طلبات سابقة.');
            } else {
                let msg = 'طلباتك السابقة:\n';
                userRequests.forEach(r => {
                    msg += `- ${new Date(r.timestamp).toLocaleString('ar')} | الحالة: ${r.status}\n`;
                });
                alert(msg);
            }
        }, { onlyOnce: true });
    }

    function showProfile() {
        const user = window.firebaseAuth.currentUser;
        if (user) {
            alert(`👤 حسابك:\nالبريد: ${user.email}\nالمعرف: ${user.uid}`);
        }
    }
</script>

<!-- أيقونات Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</body>
</html>
