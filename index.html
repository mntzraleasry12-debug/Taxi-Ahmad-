<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>شطرنج - Chess</title>
<style>
  :root{
    --light:#f0d9b5;
    --dark:#b58863;
    --gold:#d4af37;
  }
  
  *{box-sizing:border-box; margin:0; padding:0;}
  
  body{
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: #1a1e24; /* خلفية غامقة مريحة للعين */
    color:#fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow-x:hidden;
  }

  /* ------------------ الواجهة الرئيسية ------------------ */
  #menu {
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    background: rgba(30, 35, 45, 0.9);
    padding: 30px 20px; border-radius: 20px;
    border: 1px solid rgba(212, 175, 55, 0.3);
    box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    width: min(90vw, 400px);
    margin: 20px;
  }

  h1 {
    font-size: 28px; font-weight: bold; text-align: center;
    color: var(--gold); text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
  }

  .section-title { font-size: 14px; color: #aaa; margin-bottom: 10px; align-self: flex-start; }

  /* الألوان الجاهزة */
  .theme-grid { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
  .theme-btn {
    width: 45px; height: 45px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.1);
    cursor: pointer; transition: all 0.2s ease;
  }
  .theme-btn:hover { transform: scale(1.1); border-color: var(--gold); }
  .theme-btn.active { border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }

  /* إعدادات مخصصة */
  .custom-settings {
    display: flex; flex-direction: column; gap: 10px; width: 100%;
    background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px;
  }
  .color-picker-group { display: flex; justify-content: space-between; align-items: center; }
  .color-picker-group label { font-size: 14px; color: #ccc; }
  input[type="color"] {
    -webkit-appearance: none; border: none; width: 35px; height: 35px; border-radius: 6px;
    cursor: pointer; background: none;
  }
  input[type="color"]::-webkit-color-swatch { border: 2px solid #fff; border-radius: 6px; }

  /* رفع صورة الغلاف */
  .cover-upload-group {
    display: flex; flex-direction: column; gap: 10px; width: 100%;
    background: rgba(0,0,0,0.2); padding: 15px; border-radius: 12px;
  }
  .upload-btn {
    padding: 10px; border-radius: 8px; background: rgba(212, 175, 55, 0.1);
    border: 1px dashed var(--gold); color: var(--gold); text-align: center; cursor: pointer;
    font-size: 14px; transition: 0.2s;
  }
  .upload-btn:hover { background: rgba(212, 175, 55, 0.2); }

  .start-btn {
    width: 100%; padding: 15px; font-size: 18px; font-weight: bold; font-family: inherit;
    border-radius: 12px; border: none;
    background: linear-gradient(135deg, #bf953f, #d4af37);
    color: #111; cursor: pointer; transition: all 0.2s ease; margin-top: 10px;
    box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
  }
  .start-btn:active { transform: scale(0.98); }

  /* ------------------ واجهة اللعب ------------------ */
  #game { display: none; flex-direction: column; align-items: center; gap: 15px; width: 100%; padding: 10px; }
  
  #status {
    font-size: 18px; font-weight: bold; padding: 8px 25px; border-radius: 20px;
    background: rgba(30, 35, 45, 0.9); border: 1px solid var(--gold);
    color: #f0d9b5; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
  }

  /* الحاوية اللي تحمل صورة الغلاف (إذا وجدت) */
  #board-container {
    padding: 0px; /* بدون سمك افتراضي */
    border-radius: 12px;
    background-size: cover; background-position: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    transition: all 0.3s ease;
    /* أهم شي هنا: حجم الرقعة كبير وواضح */
    width: min(96vw, 600px);
  }
  
  /* إذا في صورة غلاف، نضيف سمك للإطار */
  #board-container.has-cover { padding: 12px; }

  #board {
    direction: ltr;
    width: 100%; aspect-ratio: 1;
    display: grid; grid-template-columns: repeat(8, 1fr);
    border-radius: 8px; overflow: hidden;
    /* شلنا الـ 3D تماماً، صارت مسطحة */
    border: 2px solid #000;
  }

  .sq {
    position: relative; display: flex; align-items: center; justify-content: center;
    /* حجم الخط يتناسب مع حجم الشاشة */
    font-size: min(10vw, 60px); line-height: 1; cursor: pointer;
    user-select: none; -webkit-user-select: none;
    font-family: "Segoe UI Symbol", "Apple Symbols", serif;
  }
  
  .sq.light { background: var(--light); }
  .sq.dark { background: var(--dark); }
  
  .sq.w { color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
  .sq.b { color: #222; -webkit-text-stroke: 1px #000; text-shadow: 0 2px 4px rgba(0,0,0,0.4); }
  
  .sq.sel { box-shadow: inset 0 0 0 4px var(--gold); }
  .sq.move::after {
    content: ""; position: absolute; width: 30%; height: 30%; border-radius: 50%;
    background: rgba(0, 0, 0, 0.3);
  }
  .sq.capture::after {
    content: ""; position: absolute; inset: 8%; border-radius: 50%;
    border: 5px solid rgba(200, 50, 50, 0.5);
  }

  .game-actions { display: flex; gap: 10px; margin-top: 10px; margin-bottom: 20px; }
  .game-actions button {
    padding: 10px 20px; font-size: 15px; font-family: inherit; cursor: pointer;
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.2);
    background: rgba(30, 35, 45, 0.9); color: #fff;
    transition: all 0.2s;
  }
  .game-actions button:active { background: #444; }

</style>
</head>
<body>

  <!-- ================= الواجهة الرئيسية ================= -->
  <div id="menu">
    <h1>♞ شطرنج ♞</h1>
    
    <div style="width: 100%;">
      <div class="section-title">اختر لون القاعدة:</div>
      <div class="theme-grid">
        <div class="theme-btn active" style="background: linear-gradient(45deg, #f0d9b5 50%, #b58863 50%);" onclick="applyTheme('#f0d9b5', '#b58863', this)"></div>
        <div class="theme-btn" style="background: linear-gradient(45deg, #eeeed2 50%, #769656 50%);" onclick="applyTheme('#eeeed2', '#769656', this)"></div>
        <div class="theme-btn" style="background: linear-gradient(45deg, #e8edf9 50%, #4b7399 50%);" onclick="applyTheme('#e8edf9', '#4b7399', this)"></div>
        <div class="theme-btn" style="background: linear-gradient(45deg, #ebebeb 50%, #7a7a7a 50%);" onclick="applyTheme('#ebebeb', '#7a7a7a', this)"></div>
        <div class="theme-btn" style="background: linear-gradient(45deg, #f9c8c8 50%, #8b3a3a 50%);" onclick="applyTheme('#f9c8c8', '#8b3a3a', this)"></div>
      </div>
    </div>

    <div class="custom-settings">
      <div class="color-picker-group">
        <label>لون المربعات الفاتحة:</label>
        <input type="color" id="lightColor" value="#f0d9b5" onchange="customTheme()">
      </div>
      <div class="color-picker-group">
        <label>لون المربعات الغامقة:</label>
        <input type="color" id="darkColor" value="#b58863" onchange="customTheme()">
      </div>
    </div>

    <div class="cover-upload-group">
      <div class="section-title" style="margin-bottom:0;">صورة غلاف للقاعدة (اختياري):</div>
      <label for="coverInput" class="upload-btn">📸 اختر صورة</label>
      <input type="file" id="coverInput" accept="image/*" style="display: none;" onchange="loadCover(event)">
    </div>

    <button class="start-btn" onclick="startGame()">ابدأ اللعب ♟️</button>
  </div>

  <!-- ================= واجهة اللعب ================= -->
  <div id="game">
    <div id="status">دور الأبيض</div>
    
    <div id="board-container">
      <div id="board"></div>
    </div>
    
    <div class="game-actions">
      <button onclick="reset()">↻ إعادة اللعب</button>
      <button onclick="goToMenu()">🏠 القائمة</button>
    </div>
  </div>

<script>
/* ============================================================
   1. إعدادات الواجهة
   ============================================================ */
function applyTheme(light, dark, btnElement) {
  document.documentElement.style.setProperty('--light', light);
  document.documentElement.style.setProperty('--dark', dark);
  document.getElementById('lightColor').value = light;
  document.getElementById('darkColor').value = dark;
  
  if(btnElement) {
    document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
    btnElement.classList.add('active');
  }
}

function customTheme() {
  const light = document.getElementById('lightColor').value;
  const dark = document.getElementById('darkColor').value;
  document.documentElement.style.setProperty('--light', light);
  document.documentElement.style.setProperty('--dark', dark);
  document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
}

function loadCover(event) {
  const file = event.target.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = function(e) {
      const container = document.getElementById('board-container');
      container.style.backgroundImage = `url(${e.target.result})`;
      container.classList.add('has-cover'); // عشان نضيف الحواف
      document.querySelector('.upload-btn').textContent = "✅ تم اختيار الصورة";
      document.querySelector('.upload-btn').style.color = "#4ade80";
    };
    reader.readAsDataURL(file);
  }
}

function startGame() {
  document.getElementById('menu').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  reset();
}

function goToMenu() {
  document.getElementById('game').style.display = 'none';
  document.getElementById('menu').style.display = 'flex';
}

/* ============================================================
   2. محرك الشطرنج
   ============================================================ */
const inside = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const other  = c => (c === 'w' ? 'b' : 'w');
const colorOf = p => (p === p.toUpperCase() ? 'w' : 'b');

const DIRS = {
  R: [[1,0],[-1,0],[0,1],[0,-1]],
  B: [[1,1],[1,-1],[-1,1],[-1,-1]],
  N: [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]
};

const GLYPH = { K:'♚', Q:'♛', R:'♜', B:'♝', N:'♞', P:'♟' };

const START = [
  'rnbqkbnr', 'pppppppp', '........', '........',
  '........', '........', 'PPPPPPPP', 'RNBQKBNR'
];

function freshState() {
  return {
    board: START.map(row => row.split('').map(ch => (ch === '.' ? null : ch))),
    turn: 'w',
    castling: { wK:true, wQ:true, bK:true, bQ:true },
    ep: null
  };
}

let state, sel, legal, gameOver;

function isAttacked(b, r, c, by) {
  const pr = r + (by === 'w' ? 1 : -1);
  for (const dc of [-1, 1]) {
    if (inside(pr, c + dc) && b[pr][c + dc] === (by === 'w' ? 'P' : 'p')) return true;
  }
  for (const [dr, dc] of DIRS.N) {
    const rr = r + dr, cc = c + dc;
    if (inside(rr, cc) && b[rr][cc] === (by === 'w' ? 'N' : 'n')) return true;
  }
  for (const [dr, dc] of DIRS.R.concat(DIRS.B)) {
    const rr = r + dr, cc = c + dc;
    if (inside(rr, cc) && b[rr][cc] === (by === 'w' ? 'K' : 'k')) return true;
  }
  for (const [dr, dc] of DIRS.R) {
    let rr = r + dr, cc = c + dc;
    while (inside(rr, cc)) {
      const q = b[rr][cc];
      if (q) {
        if (colorOf(q) === by && (q.toUpperCase() === 'R' || q.toUpperCase() === 'Q')) return true;
        break;
      }
      rr += dr; cc += dc;
    }
  }
  for (const [dr, dc] of DIRS.B) {
    let rr = r + dr, cc = c + dc;
    while (inside(rr, cc)) {
      const q = b[rr][cc];
      if (q) {
        if (colorOf(q) === by && (q.toUpperCase() === 'B' || q.toUpperCase() === 'Q')) return true;
        break;
      }
      rr += dr; cc += dc;
    }
  }
  return false;
}

function findKing(b, color) {
  const k = color === 'w' ? 'K' : 'k';
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (b[r][c] === k) return [r, c];
  return null;
}

function inCheck(b, color) {
  const k = findKing(b, color);
  return k ? isAttacked(b, k[0], k[1], other(color)) : false;
}

function genMoves(st, r, c) {
  const b = st.board, p = b[r][c];
  if (!p) return [];
  const me = colorOf(p);
  const type = p.toUpperCase();
  const moves = [];
  const add = (tr, tc, extra) => moves.push({ from:[r,c], to:[tr,tc], ...(extra || {}) });

  const slide = dirs => {
    for (const [dr, dc] of dirs) {
      let tr = r + dr, tc = c + dc;
      while (inside(tr, tc)) {
        const q = b[tr][tc];
        if (!q) add(tr, tc);
        else {
          if (colorOf(q) !== me) add(tr, tc);
          break;
        }
        tr += dr; tc += dc;
      }
    }
  };

  const step = dirs => {
    for (const [dr, dc] of dirs) {
      const tr = r + dr, tc = c + dc;
      if (inside(tr, tc) && (!b[tr][tc] || colorOf(b[tr][tc]) !== me)) add(tr, tc);
    }
  };

  if (type === 'P') {
    const dir = me === 'w' ? -1 : 1;
    const startRow = me === 'w' ? 6 : 1;
    const promoRow = me === 'w' ? 0 : 7;

    const pawnAdd = (tr, tc, extra) => {
      if (tr === promoRow) {
        for (const pr of ['Q','R','B','N'])
          add(tr, tc, { ...(extra || {}), promo: me === 'w' ? pr : pr.toLowerCase() });
      } else add(tr, tc, extra);
    };

    const one = r + dir;
    if (inside(one, c) && !b[one][c]) {
      pawnAdd(one, c);
      if (r === startRow && !b[r + 2 * dir][c]) add(r + 2 * dir, c, { double:true });
    }
    for (const dc of [-1, 1]) {
      const tr = r + dir, tc = c + dc;
      if (!inside(tr, tc)) continue;
      const q = b[tr][tc];
      if (q && colorOf(q) !== me) pawnAdd(tr, tc);
      else if (!q && st.ep && st.ep[0] === tr && st.ep[1] === tc) add(tr, tc, { ep:true });
    }
  }
  else if (type === 'N') step(DIRS.N);
  else if (type === 'B') slide(DIRS.B);
  else if (type === 'R') slide(DIRS.R);
  else if (type === 'Q') slide(DIRS.R.concat(DIRS.B));
  else if (type === 'K') {
    step(DIRS.R.concat(DIRS.B));
    const home = me === 'w' ? 7 : 0;
    const rook = me === 'w' ? 'R' : 'r';
    const kR = me === 'w' ? 'wK' : 'bK';
    const qR = me === 'w' ? 'wQ' : 'bQ';

    if (r === home && c === 4 && !isAttacked(b, r, c, other(me))) {
      if (st.castling[kR] && b[home][7] === rook && !b[home][5] && !b[home][6] &&
          !isAttacked(b, home, 5, other(me)) && !isAttacked(b, home, 6, other(me))) {
        add(home, 6, { castle:'K' });
      }
      if (st.castling[qR] && b[home][0] === rook && !b[home][1] && !b[home][2] && !b[home][3] &&
          !isAttacked(b, home, 3, other(me)) && !isAttacked(b, home, 2, other(me))) {
        add(home, 2, { castle:'Q' });
      }
    }
  }
  return moves;
}

function applyMove(b, m) {
  const nb = b.map(row => row.slice());
  const [fr, fc] = m.from;
  const [tr, tc] = m.to;
  const p = nb[fr][fc];
  nb[fr][fc] = null;
  if (m.ep) nb[fr][tc] = null;
  nb[tr][tc] = m.promo || p;
  if (m.castle === 'K') { nb[tr][5] = nb[tr][7]; nb[tr][7] = null; }
  if (m.castle === 'Q') { nb[tr][3] = nb[tr][0]; nb[tr][0] = null; }
  return nb;
}

function legalMoves(st, r, c) {
  const p = st.board[r][c];
  if (!p) return [];
  const me = colorOf(p);
  return genMoves(st, r, c).filter(m => !inCheck(applyMove(st.board, m), me));
}

function allLegalMoves(st) {
  const res = [];
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const p = st.board[r][c];
      if (p && colorOf(p) === st.turn) res.push(...legalMoves(st, r, c));
    }
  return res;
}

function makeMove(st, m) {
  const [fr, fc] = m.from;
  const [tr, tc] = m.to;
  const p = st.board[fr][fc];
  const me = colorOf(p);
  const nb = applyMove(st.board, m);
  const castling = { ...st.castling };

  if (p.toUpperCase() === 'K') {
    if (me === 'w') { castling.wK = castling.wQ = false; }
    else            { castling.bK = castling.bQ = false; }
  }
  if (fr === 7 && fc === 0) castling.wQ = false;
  if (fr === 7 && fc === 7) castling.wK = false;
  if (fr === 0 && fc === 0) castling.bQ = false;
  if (fr === 0 && fc === 7) castling.bK = false;
  if (tr === 7 && tc === 0) castling.wQ = false;
  if (tr === 7 && tc === 7) castling.wK = false;
  if (tr === 0 && tc === 0) castling.bQ = false;
  if (tr === 0 && tc === 7) castling.bK = false;

  let ep = null;
  if (p.toUpperCase() === 'P' && Math.abs(tr - fr) === 2) ep = [(fr + tr) / 2, fc];

  return { board: nb, turn: other(me), castling, ep };
}

const boardEl = document.getElementById('board');
const statusEl = document.getElementById('status');

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = 'sq ' + (((r + c) % 2 === 0) ? 'light' : 'dark');
      const p = state.board[r][c];
      if (p) {
        sq.textContent = GLYPH[p.toUpperCase()];
        sq.classList.add(colorOf(p));
      }
      if (sel && sel[0] === r && sel[1] === c) sq.classList.add('sel');
      const target = legal.find(m => m.to[0] === r && m.to[1] === c);
      if (target) sq.classList.add((p || target.ep) ? 'capture' : 'move');
      sq.addEventListener('click', () => onSquareClick(r, c));
      boardEl.appendChild(sq);
    }
  }
  updateStatus();
}

function updateStatus() {
  const me = state.turn;
  const moves = allLegalMoves(state);
  const check = inCheck(state.board, me);
  if (moves.length === 0) {
    gameOver = true;
    statusEl.textContent = check
      ? (me === 'w' ? 'كش مات! 🏆 فاز الأسود' : 'كش مات! 🏆 فاز الأبيض')
      : 'تعادل — ستاليميت';
    return;
  }
  statusEl.textContent = (me === 'w' ? 'دور الأبيض' : 'دور الأسود') + (check ? ' — كش!' : '');
}

function onSquareClick(r, c) {
  if (gameOver) return;
  if (sel) {
    const m = legal.find(x => x.to[0] === r && x.to[1] === c);
    if (m) {
      state = makeMove(state, m);
      sel = null;
      legal = [];
      render();
      return;
    }
  }
  const p = state.board[r][c];
  if (p && colorOf(p) === state.turn) {
    sel = [r, c];
    legal = legalMoves(state, r, c);
  } else {
    sel = null;
    legal = [];
  }
  render();
}

function reset() {
  state = freshState();
  sel = null;
  legal = [];
  gameOver = false;
  render();
}

</script>
</body>
</html>
