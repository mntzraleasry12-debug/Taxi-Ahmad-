<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>عبقري الأرقام - لعبة أطفال</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;
    font-family:'Tajawal','Cairo','Segoe UI',Tahoma,sans-serif;
    background:
      radial-gradient(circle at 15% 10%, #8b5cf6 0%, transparent 55%),
      radial-gradient(circle at 88% 88%, #06b6d4 0%, transparent 55%),
      linear-gradient(160deg,#4c1d95,#1e3a8a 60%,#0e7490);
    min-height:100%;
    display:flex;align-items:center;justify-content:center;
    padding:14px;overflow-x:hidden;
  }
  .app{
    width:min(680px,100%);
    background:linear-gradient(#ffffff,#f5f3ff);
    border-radius:30px;padding:16px;
    box-shadow:0 25px 60px rgba(0,0,0,.45), inset 0 -6px 0 rgba(139,92,246,.15);
    position:relative;overflow:hidden;
    min-height:540px;display:flex;flex-direction:column;
  }
  header{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:18px;color:#4c1d95}
  .brand .logo{font-size:26px;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
  .stats{display:flex;align-items:center;gap:6px}
  .stat{
    display:flex;align-items:center;gap:4px;
    background:#ede9fe;color:#5b21b6;font-weight:800;font-size:15px;
    padding:6px 10px;border-radius:14px;border:2px solid #ddd6fe;
  }
  .icon-btn{
    border:2px solid #ddd6fe;background:#ede9fe;border-radius:14px;
    padding:7px 10px;font-size:15px;cursor:pointer;font-family:inherit;
  }
  .icon-btn:active{transform:translateY(2px)}
  .progress{height:12px;background:#ede9fe;border-radius:10px;margin:12px 0 4px;overflow:hidden;border:2px solid #ddd6fe}
  .bar{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .35s}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:6px 0}

  /* ===== شاشة البداية ===== */
  .start{text-align:center;animation:fadeIn .4s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .mascot{font-size:64px;display:inline-block;animation:bob 1.8s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .start h1{margin:6px 0 2px;color:#4c1d95;font-size:29px}
  .start p{margin:0 0 16px;color:#6b7280;font-weight:600;font-size:15px}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{
    border:none;cursor:pointer;font-family:inherit;font-weight:800;font-size:16px;color:#1e293b;
    background:linear-gradient(#fff,#eef2ff);
    border-radius:20px;padding:16px 8px;
    box-shadow:0 6px 0 #c7d2fe,0 10px 20px rgba(79,70,229,.15);
    display:flex;flex-direction:column;align-items:center;gap:6px;
    transition:transform .08s,box-shadow .08s;
  }
  .mode span{font-size:30px}
  .mode:active{transform:translateY(5px);box-shadow:0 1px 0 #c7d2fe}

  /* ===== السؤال ===== */
  .q-text{text-align:center;font-size:21px;font-weight:800;color:#4c1d95;margin:0}
  .visual{
    min-height:118px;display:flex;align-items:center;justify-content:center;
    background:#f8f5ff;border-radius:20px;padding:10px;border:2px dashed #ddd6fe;
  }
  .emoji-grid{display:flex;flex-wrap:wrap;gap:2px 6px;justify-content:center}
  .emoji{font-size:34px;line-height:1.2;display:inline-block;
    animation:pop .35s cubic-bezier(.34,1.56,.64,1) backwards}
  @keyframes pop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}

  .seq{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;direction:ltr}
  .term{
    min-width:52px;height:60px;display:flex;align-items:center;justify-content:center;
    font-size:25px;font-weight:800;color:#4c1d95;background:#fff;border-radius:14px;
    border:3px solid #ddd6fe;box-shadow:0 4px 0 #ddd6fe;
  }
  .term.blank{color:#a855f7;border-color:#c4b5fd;border-style:dashed;background:#faf5ff;
    animation:pulse 1.2s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

  .add-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;direction:ltr}
  .grp{display:flex;flex-wrap:wrap;gap:1px;max-width:150px;justify-content:center;
    background:#fff;border-radius:14px;padding:6px;border:2px solid #ddd6fe}
  .grp .emoji{font-size:23px}
  .op{font-size:28px;font-weight:800;color:#7c3aed}
  .qmark{font-size:28px;font-weight:800;color:#a855f7;min-width:52px;height:56px;
    display:flex;align-items:center;justify-content:center;
    border:3px dashed #c4b5fd;border-radius:14px;background:#faf5ff}

  /* ===== الاختيارات ===== */
  .options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
  .opt{
    font-family:inherit;font-size:32px;font-weight:800;color:#1e293b;cursor:pointer;
    padding:14px 8px;border-radius:18px;border:none;
    background:linear-gradient(#fff,#eef2ff);
    box-shadow:0 6px 0 #c7d2fe,0 8px 16px rgba(79,70,229,.12);
    transition:transform .08s,box-shadow .08s,background .2s;
  }
  .opt:active{transform:translateY(5px);box-shadow:0 1px 0 #c7d2fe}
  .opt.correct{background:linear-gradient(#86efac,#22c55e);color:#fff;
    box-shadow:0 6px 0 #15803d;animation:bounce .45s}
  .opt.wrong{background:linear-gradient(#fca5a5,#ef4444);color:#fff;
    box-shadow:0 6px 0 #b91c1c;animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
  @keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  /* ===== رسائل التشجيع ===== */
  .feedback{
    position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(0);
    font-size:26px;font-weight:900;padding:10px 22px;border-radius:18px;
    pointer-events:none;opacity:0;white-space:nowrap;
  }
  .feedback.show{animation:fbIn .35s forwards}
  @keyframes fbIn{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    60%{transform:translate(-50%,-50%) scale(1.15);opacity:1}
    100%{transform:translate(-50%,-50%) scale(1);opacity:1}
  }
  .feedback.good{background:#22c55e;color:#fff;box-shadow:0 10px 26px rgba(34,197,94,.55)}
  .feedback.bad{background:#ef4444;color:#fff;box-shadow:0 10px 26px rgba(239,68,68,.55)}

  .confetti-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .confetti{position:absolute;width:10px;height:14px;border-radius:3px;top:-20px;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(600px) rotate(720deg);opacity:0}}

  @media (max-width:420px){
    .emoji{font-size:28px}
    .opt{font-size:27px;padding:12px 6px}
    .brand{font-size:15px}
    .term{min-width:44px;height:52px;font-size:22px}
    .q-text{font-size:18px}
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header>
    <div class="brand"><span class="logo">🧠</span><span>عبقري الأرقام</span></div>
    <div class="stats">
      <div class="stat" title="النقاط">⭐<span id="score">0</span></div>
      <div class="stat" title="المستوى">🏆<span id="level">1</span></div>
      <div class="stat" title="التتابع">🔥<span id="streak">0</span></div>
      <button id="homeBtn" class="icon-btn" title="القائمة">🏠</button>
    </div>
  </header>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <main id="stage"></main>

  <div id="feedback" class="feedback"></div>
  <div id="confetti" class="confetti-layer"></div>
</div>

<script>
/* ================= أدوات مساعدة ================= */
const $ = id => document.getElementById(id);
const stage = $('stage'), feedbackEl = $('feedback'), confettiLayer = $('confetti');
const scoreEl = $('score'), levelEl = $('level'), streakEl = $('streak'), barEl = $('bar');

const EMOJIS = ['🍎','🍌','🍓','🐤','🐟','⭐','🎈','🚗','🌸','🍪','🐞','🧸','🍇','🦋','🍊','🐸'];
const GOOD = ['أحسنت! 🎉','رائع جداً! ⭐','أنت عبقري! 🧠','ممتاز! 👏','بطل! 🏅','صحيح! 💚'];
const BAD  = ['حاول مرة ثانية 💪','لا بأس، جرّب! 🤔','قريب جداً! 🙂'];

const randInt = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = a => a[Math.floor(Math.random()*a.length)];
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* ================= الأصوات ================= */
let actx = null;
function audio(){ if(!actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq, dur, type='sine', vol=0.12, when=0){
  const ctx = audio(); if(!ctx) return;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  o.connect(g); g.connect(ctx.destination);
  const t = ctx.currentTime + when;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.start(t); o.stop(t + dur + 0.05);
}
const sndCorrect = () => { tone(523.25,.12,'sine',.13,0); tone(659.25,.12,'sine',.13,.10); tone(783.99,.22,'sine',.13,.20); };
const sndWrong   = () => { tone(220,.18,'sawtooth',.07,0); tone(160,.26,'sawtooth',.07,.13); };
const sndClick   = () => tone(700,.06,'triangle',.06);

/* ================= حالة اللعبة ================= */
const state = {
  mode:'mixed', score:0, streak:0, level:1,
  correctInLevel:0, q:null, firstTry:true, locked:false
};

function updateHUD(){
  scoreEl.textContent = state.score;
  levelEl.textContent = state.level;
  streakEl.textContent = state.streak;
  barEl.style.width = (state.correctInLevel / 4 * 100) + '%';
}

/* ================= توليد الاختيارات ================= */
function makeOptions(correct, min, max){
  const set = new Set([correct]);
  let guard = 0;
  while(set.size < 4 && guard++ < 400){
    let d = randInt(-4,4);
    if(d === 0) d = 1;
    const v = correct + d;
    if(v >= min && v <= max) set.add(v);
  }
  let f = min;
  while(set.size < 4 && f <= max){ if(!set.has(f)) set.add(f); f++; }
  while(set.size < 4) set.add(randInt(min,max));
  return shuffle([...set]);
}

/* ================= أنواع الأسئلة ================= */
function qCount(){
  const max = state.level <= 1 ? 5 : state.level <= 3 ? 8 : 10;
  const n = randInt(1, max);
  const e = pick(EMOJIS);
  let visual = '<div class="emoji-grid">';
  for(let i=0;i<n;i++) visual += `<span class="emoji" style="animation-delay:${i*55}ms">${e}</span>`;
  visual += '</div>';
  return { text:'كم عدد الأشياء؟', visual, answer:n, options: makeOptions(n,1,12) };
}

function qMissing(){
  const step = state.level <= 1 ? 1 : state.level <= 3 ? 2 : pick([2,3,5,10]);
  const start = randInt(1, step === 1 ? 8 : 5);
  const terms = [];
  for(let i=0;i<5;i++) terms.push(start + i*step);
  const idx = randInt(1,3);
  const answer = terms[idx];
  const visual = '<div class="seq">' + terms.map((t,i)=>
      i === idx ? '<span class="term blank">?</span>' : `<span class="term">${t}</span>`
    ).join('') + '</div>';
  return {
    text:'ما هو الرقم الناقص؟',
    visual,
    answer,
    options: makeOptions(answer, Math.max(1, answer-10), answer+10)
  };
}

function qAdd(){
  const maxA = state.level <= 1 ? 3 : state.level <= 3 ? 5 : 9;
  const a = randInt(1,maxA), b = randInt(1,maxA);
  const e = pick(EMOJIS);
  const grp = n => '<div class="grp">' +
    Array.from({length:n}, (_,i)=>`<span class="emoji" style="animation-delay:${i*55}ms">${e}</span>`).join('') +
    '</div>';
  const visual = `<div class="add-row">${grp(a)}<span class="op">+</span>${grp(b)}<span class="op">=</span><span class="qmark">?</span></div>`;
  return { text:'كم مجموع الأشياء؟', visual, answer:a+b, options: makeOptions(a+b, 1, 20) };
}

/* ================= سير اللعبة ================= */
function nextQuestion(){
  const type = state.mode === 'mixed' ? pick(['count','missing','add']) : state.mode;
  state.q = type === 'count' ? qCount() : type === 'missing' ? qMissing() : qAdd();
  state.firstTry = true;
  state.locked = false;
  renderQuestion();
}

function renderQuestion(){
  stage.innerHTML = `
    <p class="q-text">${state.q.text}</p>
    <div class="visual">${state.q.visual}</div>
    <div class="options" id="options"></div>`;
  const box = $('options');
  state.q.options.forEach(n => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.textContent = n;
    b.addEventListener('click', () => answer(n, b));
    box.appendChild(b);
  });
}

function answer(num, btn){
  if(state.locked) return;

  if(num === state.q.answer){
    state.locked = true;
    btn.classList.add('correct');
    sndCorrect();

    const pts = state.firstTry ? 10 : 5;
    state.score += pts;
    if(state.firstTry) state.streak++;
    state.correctInLevel++;

    if(state.correctInLevel >= 4){
      state.level = Math.min(state.level + 1, 6);
      state.correctInLevel = 0;
    }
    updateHUD();
    confetti();
    showFeedback(pick(GOOD), 'good');

    setTimeout(() => { nextQuestion(); }, 950);

  } else {
    state.firstTry = false;
    state.streak = 0;
    btn.classList.add('wrong');
    btn.disabled = true;
    sndWrong();
    showFeedback(pick(BAD), 'bad');
    updateHUD();
  }
}

function showFeedback(text, kind){
  feedbackEl.textContent = text;
  feedbackEl.className = 'feedback ' + kind;
  void feedbackEl.offsetWidth;
  feedbackEl.classList.add('show');
  clearTimeout(showFeedback.t);
  showFeedback.t = setTimeout(() => { feedbackEl.className = 'feedback ' + kind; }, 900);
}

function confetti(){
  const colors = ['#f43f5e','#f59e0b','#22c55e','#3b82f6','#a855f7','#eab308'];
  for(let i=0;i<26;i++){
    const d = document.createElement('div');
    d.className = 'confetti';
    d.style.left = Math.random()*100 + '%';
    d.style.background = colors[i % colors.length];
    d.style.animationDuration = (1 + Math.random()*0.8) + 's';
    d.style.animationDelay = (Math.random()*0.25) + 's';
    confettiLayer.appendChild(d);
    setTimeout(() => d.remove(), 2400);
  }
}

/* ================= شاشة البداية ================= */
function showStart(){
  state.locked = true;
  stage.innerHTML = `
    <div class="start">
      <div class="mascot">🧠</div>
      <h1>عبقري الأرقام</h1>
      <p>اختر لعبتك المفضلة وابدأ المغامرة!</p>
      <div class="modes">
        <button class="mode" data-mode="count"><span>🍎</span> عدّ الأشياء</button>
        <button class="mode" data-mode="missing"><span>🔢</span> الرقم الناقص</button>
        <button class="mode" data-mode="add"><span>➕</span> الجمع</button>
        <button class="mode" data-mode="mixed"><span>🎲</span> الكل مختلط</button>
      </div>
    </div>`;
  stage.querySelectorAll('.mode').forEach(b => {
    b.addEventListener('click', () => { sndClick(); startGame(b.dataset.mode); });
  });
}

function startGame(mode){
  audio(); // تفعيل الصوت بلمسة المستخدم
  state.mode = mode;
  state.score = 0;
  state.streak = 0;
  state.level = 1;
  state.correctInLevel = 0;
  state.locked = false;
  updateHUD();
  nextQuestion();
}

$('homeBtn').addEventListener('click', () => { sndClick(); updateHUD(); showStart(); });

/* ================= انطلاق ================= */
updateHUD();
showStart();
</script>
</body>
</html>
