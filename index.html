
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>عالم العباقرة 3D</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial;
 background:linear-gradient(140deg,#101b43,#25206c,#472b85);
 color:white;
 text-align:center;
 min-height:100vh;
}
header{
 padding:20px 10px;
 background:#111a3b;
 box-shadow:0 4px 20px #0005;
}
h1{margin:5px;color:#ffdf59;font-size:27px}
header p{margin:8px;color:#cbd5ff}
.stats{
 display:flex;
 justify-content:center;
 gap:12px;
 flex-wrap:wrap;
 margin:12px;
}
.stat{
 background:#ffffff18;
 padding:10px 18px;
 border-radius:15px;
}
#menu{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
 gap:13px;
 padding:15px;
 max-width:850px;
 margin:auto;
}
.game-card{
 border:2px solid #ffffff30;
 border-radius:20px;
 padding:17px 8px;
 background:linear-gradient(145deg,#ffffff25,#ffffff09);
 color:white;
 cursor:pointer;
 font-size:16px;
 transition:.2s;
}
.game-card:active{transform:scale(.94)}
.game-card .emoji{font-size:38px;display:block;margin-bottom:9px}
#play{
 display:none;
 max-width:700px;
 margin:15px auto;
 padding:15px;
}
#scene{
 width:100%;
 height:280px;
 border-radius:22px;
 overflow:hidden;
 background:linear-gradient(#86d8ff,#d5f4ff);
}
#question{
 font-size:22px;
 font-weight:bold;
 margin:20px 5px;
 color:#ffe477;
}
#answers{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:12px;
}
.answer{
 padding:17px 5px;
 font-size:21px;
 font-weight:bold;
 color:white;
 background:#5949b7;
 border:2px solid #ffffff50;
 border-radius:17px;
 cursor:pointer;
}
.answer:active{transform:scale(.95)}
#message{
 min-height:40px;
 font-size:20px;
 margin:15px;
 font-weight:bold;
}
.controls{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
}
.btn{
 padding:12px 22px;
 border:0;
 border-radius:14px;
 background:#ffcf45;
 color:#222;
 font-size:17px;
 font-weight:bold;
 cursor:pointer;
}
#back{background:#ff7575}
footer{padding:20px;color:#aebcff}
@media(max-width:400px){
 #scene{height:230px}
 #question{font-size:19px}
 .answer{font-size:18px}
}
</style>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
 }
}
</script>
</head>

<body>

<header>
<h1>🧠 عالم العباقرة 3D</h1>
<p>نتعلم ونلعب ونصبح أذكى!</p>
<div class="stats">
 <div class="stat">⭐ النقاط: <span id="score">0</span></div>
 <div class="stat">🏆 المستوى: <span id="level">1</span></div>
 <div class="stat">🎮 الألعاب: 10</div>
</div>
</header>

<section id="menu">
 <button class="game-card" onclick="startGame(0)">
  <span class="emoji">🧩</span>تركيب الأشكال
 </button>
 <button class="game-card" onclick="startGame(1)">
  <span class="emoji">🎨</span>الألوان
 </button>
 <button class="game-card" onclick="startGame(2)">
  <span class="emoji">🔢</span>العد والأرقام
 </button>
 <button class="game-card" onclick="startGame(3)">
  <span class="emoji">🐘</span>الحيوانات
 </button>
 <button class="game-card" onclick="startGame(4)">
  <span class="emoji">🧠</span>الذاكرة
 </button>
 <button class="game-card" onclick="startGame(5)">
  <span class="emoji">🔷</span>الشكل المختلف
 </button>
 <button class="game-card" onclick="startGame(6)">
  <span class="emoji">🔤</span>الحروف العربية
 </button>
 <button class="game-card" onclick="startGame(7)">
  <span class="emoji">➕</span>الحساب
 </button>
 <button class="game-card" onclick="startGame(8)">
  <span class="emoji">🧱</span>ترتيب المكعبات
 </button>
 <button class="game-card" onclick="startGame(9)">
  <span class="emoji">💡</span>الألغاز
 </button>
</section>

<section id="play">
 <div id="scene"></div>
 <div id="question"></div>
 <div id="answers"></div>
 <div id="message"></div>
 <div class="controls">
  <button class="btn" onclick="nextQuestion()">السؤال التالي ➡️</button>
  <button class="btn" id="back" onclick="goHome()">القائمة الرئيسية</button>
 </div>
</section>

<footer>عالم العباقرة 3D © 2026</footer>

<script type="module">
import * as THREE from "three";

let score=0;
let level=1;
let currentGame=0;
let currentAnswer="";
let answered=false;
let questionNumber=0;

const $=id=>document.getElementById(id);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91ddff);

const camera=new THREE.PerspectiveCamera(
 45,1,0.1,100
);
camera.position.set(0,3,8);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
$("scene").appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x7180a0,2));

const light=new THREE.DirectionalLight(0xffffff,3);
light.position.set(4,7,5);
light.castShadow=true;
scene.add(light);

let objects=[];
let clock=new THREE.Clock();

function resize(){
 const w=$("scene").clientWidth;
 const h=$("scene").clientHeight;
 camera.aspect=w/h;
 camera.updateProjectionMatrix();
 renderer.setSize(w,h);
}
window.addEventListener("resize",resize);
resize();

function clear3D(){
 objects.forEach(o=>scene.remove(o));
 objects=[];
}

function addObject(mesh){
 mesh.castShadow=true;
 mesh.position.y=0.7;
 scene.add(mesh);
 objects.push(mesh);
 return mesh;
}

function shape(type,color,x=0,z=0){
 let geometry;

 if(type==="cube")
  geometry=new THREE.BoxGeometry(1.5,1.5,1.5);

 else if(type==="sphere")
  geometry=new THREE.SphereGeometry(.85,32,32);

 else if(type==="cone")
  geometry=new THREE.ConeGeometry(.9,1.7,4);

 else if(type==="cylinder")
  geometry=new THREE.CylinderGeometry(.7,.7,1.5,32);

 else if(type==="torus")
  geometry=new THREE.TorusGeometry(.7,.25,16,40);

 else
  geometry=new THREE.OctahedronGeometry(1);

 const material=new THREE.MeshStandardMaterial({
  color:color,
  roughness:.35,
  metalness:.1
 });

 const mesh=new THREE.Mesh(geometry,material);
 mesh.position.x=x;
 mesh.position.z=z;
 return addObject(mesh);
}

function ground(){
 const floor=new THREE.Mesh(
  new THREE.BoxGeometry(20,.2,20),
  new THREE.MeshStandardMaterial({color:0x8bd38b})
 );
 floor.position.y=-.4;
 scene.add(floor);
 objects.push(floor);
}

function show3D(type,color=0xffcc44){
 clear3D();
 ground();
 shape(type,color);
}

function showMany(type,color,count){
 clear3D();
 ground();
 for(let i=0;i<count;i++){
  let x=(i-(count-1)/2)*1.15;
  shape(type,color,x,0);
 }
 camera.position.set(0,3,9);
 camera.lookAt(0,0,0);
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function makeQuestion(q,answers,correct){
 $("question").textContent=q;
 $("answers").innerHTML="";
 $("message").textContent="";
 currentAnswer=String(correct);
 answered=false;

 shuffle(answers).forEach(answer=>{
  let btn=document.createElement("button");
  btn.className="answer";
  btn.textContent=answer;
  btn.onclick=()=>checkAnswer(answer);
  $("answers").appendChild(btn);
 });
}

function checkAnswer(answer){
 if(answered)return;
 answered=true;

 if(String(answer)===currentAnswer){
  score+=10;
  $("message").textContent="🎉 أحسنت! إجابة صحيحة +10";
  $("message").style.color="#9aff9a";
 }else{
  $("message").textContent="😊 حاول مرة أخرى! الإجابة: "+currentAnswer;
  $("message").style.color="#ffb1b1";
 }

 level=Math.floor(score/100)+1;
 $("score").textContent=score;
 $("level").textContent=level;
}

const colors=[
 {name:"أحمر",value:0xff3333},
 {name:"أزرق",value:0x2266ff},
 {name:"أصفر",value:0xffdd00},
 {name:"أخضر",value:0x22bb55},
 {name:"بنفسجي",value:0xaa44dd}
];

const shapes=[
 {name:"مكعب",type:"cube"},
 {name:"كرة",type:"sphere"},
 {name:"مخروط",type:"cone"},
 {name:"أسطوانة",type:"cylinder"},
 {name:"حلقة",type:"torus"},
 {name:"شكل ماسي",type:"diamond"}
];

const animals=[
 {name:"أسد",emoji:"🦁",letter:"أ"},
 {name:"فيل",emoji:"🐘",letter:"ف"},
 {name:"قطة",emoji:"🐱",letter:"ق"},
 {name:"كلب",emoji:"🐶",letter:"ك"},
 {name:"أرنب",emoji:"🐰",letter:"أ"},
 {name:"سمكة",emoji:"🐟",letter:"س"}
];

const riddles=[
 {q:"ما الشيء الذي له أسنان ولا يعض؟",a:"المشط",o:["المشط","الكتاب","الكرسي","الباب"]},
 {q:"ما الشيء الذي نراه في الليل ولا نراه في النهار؟",a:"النجوم",o:["النجوم","الشمس","البيت","الطاولة"]},
 {q:"كم عدد أرجل العنكبوت؟",a:"8",o:["4","6","8","10"]},
 {q:"ما الحيوان الذي يسمى ملك الغابة؟",a:"الأسد",o:["الفيل","الأسد","القطة","الحصان"]}
];

function randomItem(arr){
 return arr[Math.floor(Math.random()*arr.length)];
}

// اللعبة 1: تركيب الأشكال
function game0(){
 let s=randomItem(shapes);
 show3D(s.type,0xffa833);
 makeQuestion(
  "ما اسم هذا الشكل ثلاثي الأبعاد؟",
  shuffle([s.name,...shapes.filter(x=>x.name!==s.name).slice(0,3).map(x=>x.name)]),
  s.name
 );
}

// اللعبة 2: الألوان
function game1(){
 let c=randomItem(colors);
 show3D("sphere",c.value);
 makeQuestion(
  "ما اسم لون الكرة؟",
  shuffle([c.name,...colors.filter(x=>x.name!==c.name).slice(0,3).map(x=>x.name)]),
  c.name
 );
}

// اللعبة 3: العد
function game2(){
 let n=Math.floor(Math.random()*8)+2;
 showMany("sphere",0xffa72b,n);
 let options=shuffle([n,n+1,n-1,n+2]).map(String);
 makeQuestion("كم كرة موجودة أمامك؟",options,String(n));
}

// اللعبة 4: الحيوانات
function game3(){
 let a=randomItem(animals);
 show3D("sphere",0xffcc77);
 makeQuestion(
  "ما اسم الحيوان "+a.emoji+" ؟",
  shuffle([a.name,...animals.filter(x=>x.name!==a.name).slice(0,3).map(x=>x.name)]),
  a.name
 );
}

// اللعبة 5: الذاكرة
function game4(){
 const sequence=shuffle(colors).slice(0,3);
 clear3D();
 ground();

 sequence.forEach((c,i)=>{
  shape("sphere",c.value,(i-1)*2);
 });

 let target=randomItem(sequence);
 makeQuestion(
  "تذكّر الألوان! أي لون ظهر في المجموعة؟",
  shuffle([target.name,...colors.filter(c=>!sequence.includes(c)).slice(0,3).map(c=>c.name)]),
  target.name
 );
}

// اللعبة 6: الشكل المختلف
function game5(){
 let different=randomItem(shapes);
 let same=shapes.find(s=>s.name!==different.name);

 clear3D();
 ground();

 for(let i=0;i<4;i++){
  shape(
   i===3?different.type:same.type,
   i===3?0xff3333:0x2266ff,
   (i-1.5)*1.5
  );
 }

 makeQuestion(
  "أي شكل مختلف عن بقية الأشكال؟",
  shuffle([different.name,same.name,"كرة","مكعب"]),
  different.name
 );
}

// اللعبة 7: الحروف
function game6(){
 let a=randomItem(animals);
 show3D("cube",0xffcc33);
 makeQuestion(
  "بأي حرف يبدأ اسم "+a.emoji+" "+a.name+"؟",
  shuffle([a.letter,"ب","م","س","ت"]),
  a.letter
 );
}

// اللعبة 8: الحساب
function game7(){
 let a=Math.floor(Math.random()*10)+1;
 let b=Math.floor(Math.random()*10)+1;
 let result=a+b;

 showMany("cube",0x3388ff,Math.min(a,6));
 makeQuestion(
  "احسب: "+a+" + "+b+" = ؟",
  shuffle([result,result+1,result-1,result+2]).map(String),
  result
 );
}

// اللعبة 9: ترتيب المكعبات
function game8(){
 let nums=shuffle([1,2,3,4]);
 clear3D();
 ground();

 nums.forEach((n,i)=>{
  const mesh=shape("cube",0x3377ff,(i-1.5)*1.6);
  mesh.scale.set(.5+n*.13,.5+n*.13,.5+n*.13);
 });

 makeQuestion(
  "ما أكبر رقم في ترتيب المكعبات؟",
  shuffle(nums).map(String),
  "4"
 );
}

// اللعبة 10: الألغاز
function game9(){
 let r=randomItem(riddles);
 show3D("octahedron",0xffcc33);
 makeQuestion(r.q,r.o,r.a);
}

const games=[
 game0,game1,game2,game3,game4,
 game5,game6,game7,game8,game9
];

window.startGame=function(index){
 currentGame=index;
 questionNumber=0;
 $("menu").style.display="none";
 $("play").style.display="block";
 resize();
 nextQuestion();
};

window.nextQuestion=function(){
 questionNumber++;
 games[currentGame]();
};

window.goHome=function(){
 $("play").style.display="none";
 $("menu").style.display="grid";
 clear3D();
};

function animate(){
 requestAnimationFrame(animate);
 const t=clock.getElapsedTime();

 objects.forEach((obj,i)=>{
  if(obj.geometry && obj.position.y>-.3){
   obj.rotation.y+=.008;
   if(obj.geometry.type!=="BoxGeometry"){
    obj.position.y=.7+Math.sin(t*2+i)*.09;
   }
  }
 });

 renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
