<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>الكتاب الذكي 3D — الفيزياء</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #1e2a44 0%, #0a0e17 70%);
    font-family: 'Tajawal', 'Segoe UI', sans-serif;
    color: #e8eefc; user-select: none; -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 2vh 2vw;
  }
  .book-scene {
    width: min(95vw, 145vh, 1200px);
    aspect-ratio: 1.55 / 1;
    perspective: 2800px;
    perspective-origin: 50% 40%;
    position: relative;
  }
  .book {
    position: absolute; inset: 0;
    transform-style: preserve-3d;
    transform: rotateX(6deg);
  }
  .book::before {
    content: ''; position: absolute; inset: -30px;
    background: radial-gradient(ellipse at 50% 100%, rgba(0,0,0,0.55), transparent 65%);
    transform: translateZ(-40px); filter: blur(25px); pointer-events: none;
  }
  .page {
    position: absolute;
    width: 50%; height: 100%;
    right: 0; top: 0;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 0.9s cubic-bezier(0.33, 0.1, 0.3, 1);
    will-change: transform;
  }
  .page.flipped { transform: rotateY(-180deg); }
  .page-face {
    position: absolute; inset: 0;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    background: linear-gradient(135deg, #fcf8ed 0%, #f2e9d4 100%);
    color: #1a2332;
    padding: 28px 34px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow:
      inset 0 0 90px rgba(139, 106, 52, 0.08),
      0 0 30px rgba(0,0,0,0.12);
  }
  .page-face.front {
    border-radius: 4px 10px 10px 4px;
  }
  .page-face.front::after {
    content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 40px;
    background: linear-gradient(to right, rgba(0,0,0,0.14), transparent);
    pointer-events: none;
  }
  .page-face.back {
    border-radius: 10px 4px 4px 10px;
    transform: rotateY(180deg);
  }
  .page-face.back::after {
    content: ''; position: absolute; top: 0; right: 0; bottom: 0; width: 40px;
    background: linear-gradient(to left, rgba(0,0,0,0.14), transparent);
    pointer-events: none;
  }

  /* الغلاف */
  .page.cover .page-face.front {
    background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 50%, #172554 100%);
    color: #e8eefc;
  }
  .page.cover .page-face.front::before {
    content: ''; position: absolute; inset: 18px;
    border: 1.5px solid rgba(255,255,255,0.18);
    border-radius: 8px; pointer-events: none;
  }
  .cover-content {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; text-align: center; padding: 16px; position: relative; z-index: 1;
  }
  .cover-content .badge {
    font-size: 11px; letter-spacing: 3px; opacity: 0.8;
    margin-bottom: 18px; border: 1px solid rgba(255,255,255,0.35);
    padding: 4px 14px; border-radius: 20px;
  }
  .cover-content h1 {
    font-size: clamp(30px, 4.5vw, 54px); margin: 0 0 6px;
    font-weight: 900; letter-spacing: -1px;
    text-shadow: 0 4px 24px rgba(0,0,0,0.5);
  }
  .cover-content h2 {
    font-size: clamp(13px, 1.8vw, 19px); margin: 0 0 30px;
    opacity: 0.9; font-weight: 500;
  }
  .cover-content .author { font-size: 11px; opacity: 0.65; margin-top: auto; }
  .cover-illustration {
    width: 110px; height: 110px; margin-bottom: 26px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #93c5fd, #1e40af 70%);
    box-shadow:
      0 0 60px rgba(96, 165, 250, 0.55),
      inset -10px -10px 30px rgba(0,0,0,0.35),
      inset 10px 10px 30px rgba(255,255,255,0.25);
    animation: pulse 3s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }

  .page-content {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    font-size: clamp(12px, 1.5vw, 15px);
    line-height: 1.75; color: #334155; padding-left: 4px;
  }
  .page-content::-webkit-scrollbar { width: 4px; }
  .page-content::-webkit-scrollbar-thumb { background: rgba(30,58,138,0.3); border-radius: 4px; }

  .page-title {
    font-size: clamp(17px, 2.4vw, 26px); color: #1e3a8a;
    margin: 0 0 14px; font-weight: 900;
    border-bottom: 2px solid #dbeafe;
    padding-bottom: 9px; position: relative;
  }
  .page-title::after {
    content: ''; position: absolute; bottom: -2px; right: 0;
    width: 55px; height: 2px; background: #2563eb; border-radius: 2px;
  }
  .page-num {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    font-size: 10px; color: #94a3b8; letter-spacing: 1px;
  }
  .formula-box {
    background: linear-gradient(135deg, #eff6ff, #dbeafe);
    border-right: 4px solid #2563eb;
    padding: 14px 20px; border-radius: 10px; margin: 16px 0;
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .formula {
    font-family: 'Cambria Math', 'Times New Roman', serif;
    font-size: clamp(22px, 2.8vw, 32px); font-style: italic;
    color: #1e3a8a; font-weight: 600; letter-spacing: 1px;
  }
  .formula .var { color: #2563eb; }
  .formula .op { color: #64748b; font-weight: 400; }

  .tip-box {
    background: #fef3c7; border-right: 4px solid #f59e0b;
    padding: 10px 14px; border-radius: 8px; margin: 12px 0;
    font-size: clamp(11px, 1.3vw, 13px); color: #78350f;
  }
  .tip-box strong { color: #92400e; }

  /* صفحة المحاكاة */
  .sim-page { display: flex; flex-direction: column; height: 100%; gap: 8px; }
  .sim-canvas-wrap {
    flex: 1; min-height: 0;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    border-radius: 10px; overflow: hidden; position: relative;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.4);
  }
  .sim-canvas-wrap canvas { display: block; width: 100% !important; height: 100% !important; }
  .sim-hud {
    position: absolute; top: 8px; right: 8px;
    display: flex; flex-direction: column; gap: 5px;
    font-size: 11px; color: #e2e8f0; pointer-events: none;
  }
  .hud-item {
    background: rgba(15, 23, 42, 0.78);
    padding: 4px 10px; border-radius: 6px;
    border: 1px solid rgba(96, 165, 250, 0.35);
    backdrop-filter: blur(6px);
    font-family: 'Courier New', monospace;
    direction: ltr; text-align: left;
  }
  .hud-item b { color: #60a5fa; }

  .sim-controls {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    font-size: 11px;
  }
  .slider-group {
    background: #eff6ff; padding: 7px 11px; border-radius: 8px;
    border: 1px solid #dbeafe;
  }
  .slider-label {
    display: flex; justify-content: space-between; align-items: baseline;
    margin-bottom: 5px; color: #1e3a8a; font-weight: 700; font-size: 11px;
  }
  .slider-label b { font-family: 'Courier New', monospace; color: #dc2626; direction: ltr; }
  .slider-group input[type=range] {
    width: 100%; -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 4px; background: #cbd5e1; outline: none; cursor: pointer;
  }
  .slider-group input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px;
    border-radius: 50%; background: #2563eb; border: 2px solid white;
    box-shadow: 0 2px 6px rgba(0,0,0,0.25);
  }
  .slider-group input[type=range]::-moz-range-thumb {
    width: 16px; height: 16px; border-radius: 50%;
    background: #2563eb; border: 2px solid white; cursor: pointer;
  }
  .sim-buttons { display: flex; gap: 8px; justify-content: center; }
  .btn {
    padding: 7px 18px; border-radius: 8px; border: none;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: white; font-family: inherit; font-size: 12px; font-weight: 700;
    cursor: pointer; transition: all 0.15s;
    box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.45); }
  .btn:active { transform: translateY(0); }
  .btn.secondary {
    background: linear-gradient(135deg, #64748b, #475569);
    box-shadow: 0 2px 8px rgba(71, 85, 105, 0.35);
  }

  /* اختبار */
  .quiz-option {
    display: block; width: 100%; text-align: right;
    padding: 12px 16px; margin: 7px 0;
    border: 2px solid #dbeafe; background: #f8fafc;
    border-radius: 10px; font-family: inherit;
    font-size: clamp(12px, 1.4vw, 14px);
    color: #1e293b; cursor: pointer; transition: all 0.2s;
  }
  .quiz-option:hover { border-color: #93c5fd; background: #eff6ff; }
  .quiz-option.correct { border-color: #10b981; background: #d1fae5; color: #065f46; }
  .quiz-option.wrong { border-color: #ef4444; background: #fee2e2; color: #991b1b; }
  .quiz-option.disabled { pointer-events: none; opacity: 0.75; }
  .quiz-feedback {
    margin-top: 12px; padding: 10px 14px; border-radius: 8px;
    font-size: clamp(11px, 1.3vw, 13px);
    display: none; animation: fadeIn 0.35s;
  }
  .quiz-feedback.show { display: block; }
  .quiz-feedback.ok { background: #d1fae5; color: #065f46; border-right: 4px solid #10b981; }
  .quiz-feedback.bad { background: #fee2e2; color: #991b1b; border-right: 4px solid #ef4444; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* TOC */
  .toc-list { list-style: none; padding: 0; margin: 14px 0; }
  .toc-list li {
    padding: 9px 12px; margin: 5px 0;
    background: #f8fafc; border-radius: 8px;
    border-right: 3px solid #cbd5e1;
    display: flex; justify-content: space-between; align-items: center;
    font-size: clamp(12px, 1.4vw, 13px);
  }
  .toc-list li.active {
    background: #dbeafe; border-right-color: #2563eb;
    color: #1e3a8a; font-weight: 700;
  }
  .toc-list li .num { color: #64748b; font-family: monospace; font-size: 11px; }

  /* الغلاف الخلفي */
  .page-face.back.cover-back {
    padding: 0;
    background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
    border: none;
  }
  .back-cover {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; text-align: center; color: #e8eefc; padding: 30px;
  }
  .back-cover h2 { font-size: clamp(20px, 2.5vw, 26px); margin-bottom: 10px; }
  .back-cover p { opacity: 0.72; font-size: clamp(11px, 1.3vw, 13px); max-width: 85%; line-height: 1.7; }

  .nav-hint {
    position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%
