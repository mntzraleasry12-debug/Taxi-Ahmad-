<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>مغامرات العباقرة 3D</title>
<style>
  /* ================= إعدادات عامة ================= */
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800;900&display=swap');

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    font-family: 'Tajawal', sans-serif;
    user-select: none;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    /* خلفية سماوية سحرية مستوحاة من الصورة */
    background: 
      radial-gradient(circle at 50% 0%, #2e1065 0%, transparent 70%),
      radial-gradient(circle at 10% 90%, #06b6d4 0%, transparent 40%),
      radial-gradient(circle at 90% 90%, #8b5cf6 0%, transparent 40%),
      linear-gradient(180deg, #020617 0%, #1e1b4b 100%);
    overflow: hidden;
  }

  /* نجوم متلألئة في الخلفية */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    width: 4px;
    height: 4px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 20px #a855f7;
    animation: twinkle 3s infinite alternate;
  }
  @keyframes twinkle {
    0% { opacity: 0.2; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1.2); }
  }

  /* ================= الحاوية الرئيسية ================= */
  .game-ui {
    position: relative;
    z-index: 10;
    width: min(100%, 500px);
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  /* ================= الشريط العلوي ================= */
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .stats-box {
    background: linear-gradient(180deg, #1e3a8a, #0f172a);
    border: 2px solid #facc15;
    border-radius: 12px;
    padding: 5px 10px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5), inset 0 0 10px rgba(250, 204, 21, 0.3);
  }
  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    color: #fff;
    font-size: 12px;
    font-weight: 800;
  }
  .stat-row .val { color: #facc15; font-size: 14px; }

  .top-icons {
    display: flex;
    gap: 10px;
  }
  .circle-btn {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: linear-gradient(180deg, #3b82f6, #1d4ed8);
    border: 2px solid #93c5fd;
    box-shadow: 0 4px 0 #1e3a8a, 0 6px 10px rgba(0,0,0,0.5);
    color: #fff;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.1s;
  }
  .circle-btn:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #1e3a8a;
  }

  /* ================= العنوان ================= */
  .title-area {
    text-align: center;
    margin-top: -10px;
    position: relative;
  }
  .crown {
    font-size: 35px;
    position: absolute;
    top: -25px;
    left: 50%;
    transform: translateX(-50%);
    filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5));
    animation: float 2s infinite ease-in-out;
  }
  @keyframes float { 0%,100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-8px); } }
  
  .title-text {
    font-size: 34px;
    font-weight: 900;
    color: #facc15;
    margin: 0;
    line-height: 1.1;
    text-shadow: 
      0 2px 0 #b45309,
      0 4px 0 #78350f,
      0 6px 10px rgba(0,0,0,0.8),
      0 0 20px rgba(250, 204, 21, 0.6);
    -webkit-text-stroke: 1px #fff;
  }
  .title-text span {
    color: #38bdf8;
    text-shadow: 
      0 2px 0 #0369a1,
      0 4px 0 #082f49,
      0 6px 10px rgba(0,0,0,0.8),
      0 0 20px rgba(56, 189, 248, 0.6);
  }
  
  .subtitle {
    background: linear-gradient(90deg, transparent, #b45309, #f59e0b, #b45309, transparent);
    color: #fff;
    font-size: 12px;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 5px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    border-top: 1px solid #fde047;
    border-bottom: 1px solid #78350f;
  }

  /* ================= شبكة الألعاب ================= */
  .games-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin: 10px 0;
  }

  .game-btn {
    aspect-ratio: 1.1 / 1;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.7);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    color: #fff;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    position: relative;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
    transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 
      0 6px 0 var(--shadow),
      0 10px 15px rgba(0,0,0,0.4),
      inset 0 4px 8px rgba(255,255,255,0.5),
      inset 0 -4px 8px rgba(0,0,0,0.2);
    background: linear-gradient(180deg, var(--base), var(--dark));
  }

  .game-btn .icon {
    font-size: 28px;
    filter: drop-shadow(0 3px 3px rgba(0,0,0,0.4));
  }

  .game-btn:active {
    transform: translateY(6px);
    box-shadow: 
      0 0 0 var(--shadow),
      0 2px 5px rgba(0,0,0,0.4),
      inset 0 2px 4px rgba(255,255,255,0.3);
  }

  /* ألوان الأزرار */
  .btn-purple { --base: #c084fc; --dark: #9333ea; --shadow: #6b21a8; }
  .btn-green  { --base: #4ade80; --dark: #16a34a; --shadow: #14532d; }
  .btn-blue   { --base: #38bdf8; --dark: #0284c7; --shadow: #082f49; }
  .btn-pink   { --base: #f472b6; --dark: #db2777; --shadow: #831843; }
  .btn-orange { --base: #fb923c; --dark: #ea580c; --shadow: #7c2d12; }
  .btn-teal   { --base: #2dd4bf; --dark: #0d9488; --shadow: #134e4a; }

  /* ================= الشريط السفلي ================= */
  .bottom-bar {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 8px;
    margin-top: 5px;
  }

  /* الأزرار الجانبية */
  .side-btn {
    flex: 1;
    padding: 10px 5px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.6);
    color: #fff;
    font-weight: 800;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: 0.1s;
    text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    box-shadow: 
      0 5px 0 var(--shadow),
      0 8px 10px rgba(0,0,0,0.4),
      inset 0 2px 4px rgba(255,255,255,0.4);
    background: linear-gradient(180deg, var(--base), var(--dark));
  }
  .side-btn:active {
    transform: translateY(5px);
    box-shadow: 0 0 0 var(--shadow), inset 0 2px 4px rgba(255,255,255,0.3);
  }
  
  .btn-parents { --base: #a78bfa; --dark: #6d28d9; --shadow: #4c1d95; }
  .btn-reset   { --base: #f87171; --dark: #dc2626; --shadow: #7f1d1d; }

  /* زر البداية الكبير */
  .play-btn {
    flex: 1.5;
    padding: 12px 10px;
    border-radius: 18px;
    border: 3px solid #fff;
    color: #78350f;
    font-weight: 900;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    cursor: pointer;
    position: relative;
    transition: 0.1s;
    background: linear-gradient(180deg, #fde047, #f59e0b);
    box-shadow: 
      0 7px 0 #b45309,
      0 12px 15px rgba(0,0,0,0.5),
      inset 0 4px 8px rgba(255,255,255,0.8),
      inset 0 -4px 8px rgba(0,0,0,0.2);
    animation: playPulse 2s infinite;
  }
  
  @keyframes playPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.03); }
  }

  .play-btn .icon { font-size: 24px; }
  .play-btn:active {
    transform: translateY(7px) scale(0.98);
    box-shadow: 
      0 0 0 #b45309,
      0 4px 8px rgba(0,0,0,0.5),
      inset 0 2px 4px rgba(255,255,255,0.6);
    animation: none;
  }

  /* نجوم حول زر البداية */
  .play-btn::before, .play-btn::after {
    content: '⭐';
    position: absolute;
    font-size: 18px;
    top: 50%;
    transform: translateY(-50%);
    filter: drop-shadow(0 2px 2px rgba(0,0,0,0.5));
  }
  .play-btn::before { right: 8px; }
  .play-btn::after { left: 8px; }

  /* تجاوب مع الشاشات الصغيرة جداً */
  @media (max-width: 380px) {
    .title-text { font-size: 28px; }
    .game-btn { font-size: 11px; }
    .game-btn .icon { font-size: 24px; }
    .play-btn { font-size: 16px; padding: 10px 5px; }
    .play-btn::before, .play-btn::after { display: none; }
    .side-btn { font-size: 9px; padding: 8px 2px; }
  }
</style>
</head>
<body>

<!-- النجوم في الخلفية -->
<div class="stars" id="stars"></div>

<div class="game-ui">
  
  <!-- الشريط العلوي -->
  <div class="top-bar">
    <div class="stats-box">
      <div class="stat-row"><span>⭐ النجوم</span> <span class="val">0</span></div>
      <div class="stat-row"><span>🏆 المستوى</span> <span class="val">1</span></div>
      <div class="stat-row"><span>🎮 الألعاب</span> <span class="val">0</span></div>
    </div>
    <div class="top-icons">
      <button class="circle-btn" onclick="playSound()">⚙️</button>
      <button class="circle-btn" onclick="playSound()">🔊</button>
    </div>
  </div>

  <!-- العنوان -->
  <div class="title-area">
    <div class="crown">👑</div>
    <h1 class="title-text">مغامرات <span>العباقرة 3D</span></h1>
    <div class="subtitle">العب بالذكاء .. وتعلم بمتعة</div>
  </div>

  <!-- شبكة الألعاب -->
  <div class="games-grid">
    <button class="game-btn btn-purple" onclick="playSound()"><span class="icon">🧪</span>التجارب</button>
    <button class="game-btn btn-green" onclick="playSound()"><span class="icon">🌳</span>الطبيعة</button>
    <button class="game-btn btn-blue" onclick="playSound()"><span class="icon">🚀</span>الفضاء</button>
    <button class="game-btn btn-pink" onclick="playSound()"><span class="icon">🎵</span>الموسيقى</button>
    <button class="game-btn btn-orange" onclick="playSound()"><span class="icon">🏴‍☠️</span>المغامرات</button>
    <button class="game-btn btn-teal" onclick="playSound()"><span class="icon">🧩</span>كل الألعاب</button>
  </div>

  <!-- الشريط السفلي -->
  <div class="bottom-bar">
    <button class="side-btn btn-parents" onclick="playSound()">👨‍👩‍👧 لوحة الأهل</button>
    <button class="play-btn" onclick="startGame()">
      <span class="icon">▶️</span> ابدأ اللعب
    </button>
    <button class="side-btn btn-reset" onclick="playSound()">🔄 إعادة التقدم</button>
  </div>

</div>

<script>
  // 1. توليد النجوم في الخلفية ديناميكياً
  const starsContainer = document.getElementById('stars');
  for (let i = 0; i < 50; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    star.style.left = Math.random() * 100 + 'vw';
    star.style.top = Math.random() * 100 + 'vh';
    star.style.animationDelay = Math.random() * 3 + 's';
    // أحجام عشوائية للنجوم
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    starsContainer.appendChild(star);
  }

  // 2. محرك صوتي بسيط لنقرات الأزرار (بدون الحاجة لملفات صوتية)
  let audioCtx = null;
  function playSound() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
    
    gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
    
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.1);
  }

  // 3. حدث عند الضغط على "ابدأ اللعب"
  function startGame() {
    playSound();
    const btn = document.querySelector('.play-btn');
    btn.innerHTML = '<span class="icon">⏳</span> جاري التحميل...';
    
    // محاكاة الانتقال للعبة
    setTimeout(() => {
      alert('مرحباً بك في مغامرات العباقرة! 🎮\n(هنا يمكنك ربط الواجهة بلعبة الذكاء الحقيقية)');
      btn.innerHTML = '<span class="icon">▶️</span> ابدأ اللعب';
    }, 800);
  }
</script>

</body>
</html>
