
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101827">
<title>ROYAL TAXI</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101827;color:white;
 font-family:Tahoma,Arial,sans-serif;
}
:root{--gold:#e6b94e;--dark:#101827;--panel:#192538}
header{
 height:65px;background:#111c2e;
 display:flex;align-items:center;justify-content:space-between;
 padding:0 17px;border-bottom:1px solid #344052;
}
.logo{font-size:22px;font-weight:900;color:var(--gold)}
.logo small{display:block;font-size:10px;color:#ddd}
.profile{
 background:#25344a;border-radius:50%;width:40px;height:40px;
 display:grid;place-items:center;font-size:20px;
}
#map{height:48vh;min-height:310px;width:100%;z-index:1}
.map-label{
 position:absolute;z-index:500;top:78px;left:12px;
 background:#18263a;color:white;padding:11px 13px;
 border:1px solid #526077;border-radius:12px;font-size:12px;
}
.map-btn{
 position:absolute;z-index:500;left:12px;top:135px;
 background:var(--gold);border:0;border-radius:12px;
 padding:12px;font-weight:bold;
}
.panel{
 background:var(--dark);border-radius:23px 23px 0 0;
 margin-top:-18px;position:relative;z-index:600;
 padding:20px 15px 35px;
 box-shadow:0 -5px 20px #0005;
}
h3{margin:0 0 15px;font-size:17px}
.location{
 background:var(--panel);border-radius:13px;
 padding:13px;margin-bottom:10px;
 display:flex;align-items:center;gap:12px;
}
.dot{width:12px;height:12px;border-radius:50%;background:#36d28b}
.dot.red{background:#f05b65}
.location input{
 background:transparent;border:0;outline:0;color:white;
 width:100%;font-size:14px;
}
.location input::placeholder{color:#9ca9ba}
button{cursor:pointer;font-family:inherit}
.gold-btn{
 width:100%;border:0;border-radius:13px;
 background:var(--gold);color:#151b25;
 padding:15px;font-size:15px;font-weight:900;
 margin-top:9px;
}
.gold-btn:disabled{opacity:.5}
.secondary{
 background:#26364d;color:white;border:1px solid #46536a;
 border-radius:12px;padding:12px;
}
.info{font-size:12px;color:#aeb9c8;margin:10px 0}
#priceSection{display:none;margin-top:20px}
.car{
 display:flex;align-items:center;gap:12px;
 background:#1a293e;border:2px solid transparent;
 border-radius:15px;padding:13px;margin-bottom:10px;
}
.car.selected{border-color:var(--gold);background:#26354a}
.car-icon{font-size:34px}
.car-details{flex:1}
.car-details b{font-size:15px}
.car-details small{display:block;color:#aab5c4;margin-top:5px}
.price{color:var(--gold);font-size:17px;font-weight:bold}
#tripInfo{
 background:#1c2c42;padding:14px;border-radius:13px;
 margin:13px 0;font-size:13px;line-height:2;
}
#message{
 display:none;background:#1e4939;color:#b8f8d7;
 padding:14px;border-radius:12px;margin-top:15px;
}
.search-results{
 background:#202f43;border-radius:10px;
 margin-top:5px;overflow:hidden;
}
.result{
 padding:12px;border-bottom:1px solid #46536a;
 font-size:13px;cursor:pointer;
}
.result:hover{background:#34465f}
footer{text-align:center;color:#8996a9;font-size:11px;padding:20px}
</style>
</head>

<body>

<header>
 <div class="logo">
  ROYAL TAXI
  <small>رحلتك براحة وأمان</small>
 </div>
 <div class="profile">👤</div>
</header>

<div style="position:relative">
 <div id="map"></div>
 <div class="map-label">📍 حدد موقعك ووجهتك على الخريطة</div>
 <button class="map-btn" onclick="myLocation()">◎ موقعي الحالي</button>
</div>

<main class="panel">

 <h3>🚕 احجز رحلتك الآن</h3>

 <div class="location">
  <span class="dot"></span>
  <input id="pickup" placeholder="موقع الانطلاق" readonly>
 </div>

 <div class="location">
  <span class="dot red"></span>
  <input id="destination" placeholder="إلى أين تريد الذهاب؟" readonly>
 </div>

 <div style="display:flex;gap:8px">
  <button class="secondary" style="flex:1"
   onclick="setMode('pickup')">تحديد الانطلاق</button>
  <button class="secondary" style="flex:1"
   onclick="setMode('destination')">تحديد الوجهة</button>
 </div>

 <div style="margin-top:14px">
  <input id="search" placeholder="🔎 ابحث عن المكان الذي تريد الذهاب إليه"
   style="width:100%;padding:14px;border-radius:12px;border:1px solid #45546b;background:#1b2a3e;color:white;outline:0">
  <div id="results" class="search-results"></div>
 </div>

 <p class="info" id="instruction">
 اضغط على الخريطة لتحديد موقع الانطلاق أو الوجهة.
 </p>

 <button class="gold-btn" onclick="calculateTrip()">
 تثبيت الوجهة وعرض الأسعار ←
 </button>

 <section id="priceSection">
  <h3 style="margin-top:20px">💰 اختر نوع السيارة والسعر</h3>

  <div id="tripInfo">
   المسافة: --<br>
   الوقت المتوقع: --<br>
   الوجهة: --
  </div>

  <div id="cars"></div>

  <button class="gold-btn" onclick="confirmRide()">
 تأكيد طلب الرحلة
  </button>
 </section>

 <div id="message"></div>

</main>

<footer>
 ROYAL TAXI © 2026
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
/* =============================
   إعداد الخريطة
============================= */

const map=L.map('map').setView([31.05,46.26],13);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
 maxZoom:19,
 attribution:'© OpenStreetMap'
}).addTo(map);

let pickup=null;
let destination=null;
let pickupMarker=null;
let destinationMarker=null;
let routeLayer=null;
let selectedCar=null;
let distanceKm=0;
let estimatedMinutes=0;
let mode='destination';

/* =============================
   أنواع السيارات والأسعار
============================= */

const carTypes=[
 {
  id:'economy',
  name:'اقتصادي',
  icon:'🚗',
  description:'سيارة اقتصادية - 4 ركاب',
  base:1500,
  km:500
 },
 {
  id:'comfort',
  name:'مريح',
  icon:'🚙',
  description:'سيارة مريحة - 4 ركاب',
  base:2500,
  km:700
 },
 {
  id:'vip',
  name:'ملكي VIP',
  icon:'🚘',
  description:'سيارة فاخرة - 4 ركاب',
  base:4000,
  km:1000
 },
 {
  id:'family',
  name:'عائلي',
  icon:'🚐',
  description:'سيارة عائلية',
  base:5000,
  km:1200
 }
];

function setMode(value){
 mode=value;
 document.getElementById('instruction').innerText=
 value==='pickup'?
 'اضغط على الخريطة لتثبيت موقع الانطلاق':
 'اضغط على الخريطة لتثبيت الوجهة الجديدة';
}

/* =============================
   اختيار المواقع من الخريطة
============================= */

map.on('click',function(e){

 const p=[e.latlng.lat,e.latlng.lng];

 if(mode==='pickup'){
  pickup=p;
  if(pickupMarker)map.removeLayer(pickupMarker);

  pickupMarker=L.marker(p).addTo(map)
   .bindPopup('موقع الانطلاق').openPopup();

  reverseAddress(p,'pickup');

 }else{
  destination=p;

  if(destinationMarker)map.removeLayer(destinationMarker);

  destinationMarker=L.marker(p).addTo(map)
   .bindPopup('الوجهة الجديدة').openPopup();

  reverseAddress(p,'destination');
 }

});

async function reverseAddress(coords,type){
 try{
  const url=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${coords[0]}&lon=${coords[1]}`;
  const response=await fetch(url);
  const data=await response.json();

  const address=data.display_name||'موقع محدد على الخريطة';

  if(type==='pickup'){
   document.getElementById('pickup').value=address;
  }else{
   document.getElementById('destination').value=address;
  }
 }catch(e){
  document.getElementById(type).value='موقع مثبت على الخريطة';
 }
}

/* =============================
   تحديد الموقع الحالي
============================= */

function myLocation(){
 if(!navigator.geolocation){
  alert('المتصفح لا يدعم تحديد الموقع');
  return;
 }

 navigator.geolocation.getCurrentPosition(position=>{
  pickup=[
   position.coords.latitude,
   position.coords.longitude
  ];

  if(pickupMarker)map.removeLayer(pickupMarker);

  pickupMarker=L.marker(pickup).addTo(map)
   .bindPopup('موقعك الحالي').openPopup();

  map.setView(pickup,16);
  reverseAddress(pickup,'pickup');

 },()=>{
  alert('تعذر تحديد موقعك. تحقق من صلاحية الموقع والاتصال.');
 },{
  enableHighAccuracy:true,
  timeout:15000
 });
}

/* =============================
   البحث عن الأماكن
============================= */

let searchTimer;

document.getElementById('search').addEventListener('input',function(){

 clearTimeout(searchTimer);

 const query=this.value.trim();
 const results=document.getElementById('results');

 if(query.length<3){
  results.innerHTML='';
  return;
 }

 searchTimer=setTimeout(async()=>{
  try{
   const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=iq&q='+encodeURIComponent(query);

   const response=await fetch(url);
   const data=await response.json();

   results.innerHTML='';

   data.forEach(place=>{
    const item=document.createElement('div');
    item.className='result';
    item.textContent=place.display_name;

    item.onclick=()=>{
     const coords=[
      Number(place.lat),
      Number(place.lon)
     ];

     destination=coords;

     if(destinationMarker)map.removeLayer(destinationMarker);

     destinationMarker=L.marker(coords).addTo(map)
      .bindPopup('الوجهة الجديدة').openPopup();

     document.getElementById('destination').value=place.display_name;
     document.getElementById('search').value='';
     results.innerHTML='';
     map.setView(coords,15);
    };

    results.appendChild(item);
   });

  }catch(e){
   results.innerHTML='<div class="result">تعذر البحث حالياً</div>';
  }
 },600);
});

/* =============================
   حساب المسار والمسافة
============================= */

async function calculateTrip(){

 if(!pickup){
  alert('حدد موقع الانطلاق أولاً');
  return;
 }

 if(!destination){
  alert('حدد الوجهة الجديدة أولاً');
  return;
 }

 if(pickup[0]===destination[0]&&pickup[1]===destination[1]){
  alert('الانطلاق والوجهة متطابقان');
  return;
 }

 const btn=document.querySelector('.gold-btn');
 btn.disabled=true;
 btn.innerText='جارٍ حساب المسافة...';

 try{

  const url=
  `https://router.project-osrm.org/route/v1/driving/${pickup[1]},${pickup[0]};${destination[1]},${destination[0]}?overview=full&geometries=geojson`;

  const response=await fetch(url);
  const data=await response.json();

  if(!data.routes||!data.routes.length){
   throw new Error('No route');
  }

  const route=data.routes[0];

  distanceKm=route.distance/1000;
  estimatedMinutes=Math.ceil(route.duration/60);

  if(routeLayer)map.removeLayer(routeLayer);

  routeLayer=L.geoJSON(route.geometry,{
   style:{
    color:'#e6b94e',
    weight:6,
    opacity:.9
   }
  }).addTo(map);

  map.fitBounds(routeLayer.getBounds(),{padding:[30,30]});

  document.getElementById('tripInfo').innerHTML=
   `المسافة: ${distanceKm.toFixed(1)} كم<br>
    الوقت المتوقع: ${estimatedMinutes} دقيقة<br>
    الوجهة: ${document.getElementById('destination').value}`;

  showPrices();

 }catch(e){
  alert('تعذر حساب الطريق. تحقق من اتصال الإنترنت وحاول مجدداً.');
 }finally{
  btn.disabled=false;
  btn.innerText='تثبيت الوجهة وعرض الأسعار ←';
 }
}

/* =============================
   عرض قائمة السيارات والأسعار
============================= */

function showPrices(){

 const container=document.getElementById('cars');
 container.innerHTML='';

 selectedCar=null;

 carTypes.forEach(car=>{

  const price=Math.ceil(
   (car.base+distanceKm*car.km)/250
  )*250;

  const element=document.createElement('div');

  element.className='car';

  element.innerHTML=`
   <div class="car-icon">${car.icon}</div>
   <div class="car-details">
    <b>${car.name}</b>
    <small>${car.description}</small>
   </div>
   <div class="price">${price.toLocaleString('en-US')} د.ع</div>
  `;

  element.onclick=()=>{
   document.querySelectorAll('.car').forEach(c=>{
    c.classList.remove('selected');
   });

   element.classList.add('selected');

   selectedCar={
    ...car,
    price:price
   };
  };

  container.appendChild(element);
 });

 document.getElementById('priceSection').style.display='block';

 document.getElementById('priceSection').scrollIntoView({
  behavior:'smooth',
  block:'start'
 });
}

/* =============================
   تأكيد طلب الرحلة
============================= */

function confirmRide(){

 if(!selectedCar){
  alert('يرجى اختيار نوع السيارة أولاً');
  return;
 }

 const ride={
  id:'ROYAL-'+Date.now(),
  pickup:pickup,
  destination:destination,
  pickupAddress:document.getElementById('pickup').value,
  destinationAddress:document.getElementById('destination').value,
  distance:distanceKm,
  minutes:estimatedMinutes,
  car:selectedCar.name,
  price:selectedCar.price,
  status:'بانتظار السائق'
 };

 // نموذج تجريبي: لا يرسل الطلب إلى سائق حقيقي
 localStorage.setItem('royal_last_ride',JSON.stringify(ride));

 const message=document.getElementById('message');

 message.style.display='block';
 message.innerHTML=`
  <b>✅ تم إنشاء طلب الرحلة بنجاح!</b><br><br>
  رقم الطلب: ${ride.id}<br>
  السيارة: ${ride.car}<br>
  السعر: ${ride.price.toLocaleString('en-US')} دينار<br>
  المسافة: ${ride.distance.toFixed(1)} كم<br>
  الحالة: ${ride.status}<br><br>
  <small>هذه نسخة تجريبية؛ ربط السائقين الفعليين يحتاج قاعدة بيانات وخدمة طلبات مباشرة.</small>
 `;

 message.scrollIntoView({behavior:'smooth'});
}

</script>
</body>
</html>
