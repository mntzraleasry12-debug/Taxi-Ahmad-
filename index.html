<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لعبة شطرنج</title>
<style>
  :root{
    --light:#eeddc0;
    --dark:#a97a55;
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:14px;
    background:radial-gradient(circle at 50% 0%, #2b3140, #14171f 70%);
    color:#e8e8e8; font-family:system-ui, "Segoe UI", Tahoma, sans-serif;
    padding:16px;
  }
  h1{margin:0; font-size:22px; font-weight:600; letter-spacing:1px; color:#f0d9b5}
  #status{
    font-size:17px; min-height:26px; padding:6px 16px; border-radius:20px;
    background:#00000045; border:1px solid #ffffff20;
  }
  #board{
    direction:ltr;                 /* مهم: عشان ترتيب المربعات ما ينقلب */
    width:min(92vmin, 560px); aspect-ratio:1;
    display:grid; grid-template-columns:repeat(8,1fr);
    border:8px solid #4a3527; border-radius:10px;
    box-shadow:0 18px 45px #000a, inset 0 0 0 2px #00000040;
    overflow:hidden;
  }
  .sq{
    position:relative; display:flex; align-items:center; justify-content:center;
    font-size:min(9.5vmin,60px); line-height:1; cursor:pointer;
    user-select:none; -webkit-user-select:none;
    font-family:"Segoe UI Symbol","Apple Symbols","Noto Sans Symbols 2",serif;
    transition:filter .12s;
  }
  .sq.light{background:var(--light)}
  .sq.dark {background:var(--dark)}
  .sq:hover{filter:brightness(1.06)}

  /* لون القطع */
  .sq.w{color:#fbfbfb; -webkit-text-stroke:1.6px #2f2f2f; text-shadow:0 2px 3px #0006}
  .sq.b{color:#1e1e1e; -webkit-text-stroke:1.2px #000; text-shadow:0 2px 3px #0004}

  .sq.sel{box-shadow:inset 0 0 0 4px #f5c518}
  .sq.move::after{
    content:""; position:absolute; width:26%; height:26%; border-radius:50%;
    background:#00000055;
  }
  .sq.capture::after{
    content:""; position:absolute; inset:6%; border-radius:50%;
    border:6px solid #00000055;
  }
  button{
    padding:10px 26px; font-size:16px; font-family:inherit; cursor:pointer;
    border-radius:10px; border:1px solid #ffffff25;
    background:linear-gradient(#5b4636,#3d2e23); color:#f0d9b5;
    transition:transform .1s;
  }
  button:active{transform:scale(.96)}
</style>
</head>
<body>

  <h1>♞ شطرنج</h1>
  <div id="status">دور الأبيض</div>
  <div id="board"></div>
  <button id="reset">↻ إعادة اللعب</button>

<script>
/* ============================================================
   أدوات مساعدة
   ============================================================ */
const inside = (r, c) => r >= 0 && r < 8 && c >= 0 && c < 8;
const other  = c => (c === 'w' ? 'b' : 'w');
const colorOf = p => (p === p.toUpperCase() ? 'w' : 'b');

const DIRS = {
  R: [[1,0],[-1,0],[0,1],[0,-1]],
  B: [[1,1],[1,-1],[-1,1],[-1,-1]],
  N: [[1,2],[2,1],[-1,2],[-2,1],[1,-2],[2,-1],[-1,-2],[-2,-1]]
};

const GLYPH = { K:'♚', Q:'♛', R:'♜', B:'♝', N:'♞', P:'♟' };

/* ============================================================
   الحالة الابتدائية
   ============================================================ */
const START = [
  'rnbqkbnr',
  'pppppppp',
  '........',
  '........',
  '........',
  '........',
  'PPPPPPPP',
  'RNBQKBNR'
];

function freshState() {
  return {
    board: START.map(row => row.split('').map(ch => (ch === '.' ? null : ch))),
    turn: 'w',
    castling: { wK:true, wQ:true, bK:true, bQ:true }, // حقوق التبييت
    ep: null                                           // مربع الأون باسان
  };
}

let state, sel, legal, gameOver;

/* ============================================================
   هل المربع مُهاجَم؟
   ============================================================ */
function isAttacked(b, r, c, by) {
  // البيادق
  const pr = r + (by === 'w' ? 1 : -1);
  for (const dc of [-1, 1]) {
    if (inside(pr, c + dc) && b[pr][c + dc] === (by === 'w' ? 'P' : 'p')) return true;
  }
  // الأحصنة
  for (const [dr, dc] of DIRS.N) {
    const rr = r + dr, cc = c + dc;
    if (inside(rr, cc) && b[rr][cc] === (by === 'w' ? 'N' : 'n')) return true;
  }
  // الملك
  for (const [dr, dc] of DIRS.R.concat(DIRS.B)) {
    const rr = r + dr, cc = c + dc;
    if (inside(rr, cc) && b[rr][cc] === (by === 'w' ? 'K' : 'k')) return true;
  }
  // الرخ + الوزير (خطوط مستقيمة)
  for (const [dr, dc] of DIRS.R) {
    let rr = r + dr, cc = c + dc;
    while (inside(rr, cc)) {
      const q = b[rr][cc];
      if (q) {
        if (colorOf(q) === by && (q.toUpperCase() === 'R' || q.toUpperCase() === 'Q')) return true;
        break;
      }
      rr += dr; cc += dc;
    }
  }
  // الفيل + الوزير (أقطار)
  for (const [dr, dc] of DIRS.B) {
    let rr = r + dr, cc = c + dc;
    while (inside(rr, cc)) {
      const q = b[rr][cc];
      if (q) {
        if (colorOf(q) === by && (q.toUpperCase() === 'B' || q.toUpperCase() === 'Q')) return true;
        break;
      }
      rr += dr; cc += dc;
    }
  }
  return false;
}

function findKing(b, color) {
  const k = color === 'w' ? 'K' : 'k';
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++)
      if (b[r][c] === k) return [r, c];
  return null;
}

function inCheck(b, color) {
  const k = findKing(b, color);
  return k ? isAttacked(b, k[0], k[1], other(color)) : false;
}

/* ============================================================
   توليد الحركات (بدون التحقق من الكش)
   ============================================================ */
function genMoves(st, r, c) {
  const b = st.board, p = b[r][c];
  if (!p) return [];

  const me = colorOf(p);
  const type = p.toUpperCase();
  const moves = [];
  const add = (tr, tc, extra) => moves.push({ from:[r,c], to:[tr,tc], ...(extra || {}) });

  const slide = dirs => {
    for (const [dr, dc] of dirs) {
      let tr = r + dr, tc = c + dc;
      while (inside(tr, tc)) {
        const q = b[tr][tc];
        if (!q) add(tr, tc);
        else {
          if (colorOf(q) !== me) add(tr, tc);
          break;
        }
        tr += dr; tc += dc;
      }
    }
  };

  const step = dirs => {
    for (const [dr, dc] of dirs) {
      const tr = r + dr, tc = c + dc;
      if (inside(tr, tc) && (!b[tr][tc] || colorOf(b[tr][tc]) !== me)) add(tr, tc);
    }
  };

  if (type === 'P') {
    const dir      = me === 'w' ? -1 : 1;
    const startRow = me === 'w' ? 6 : 1;
    const promoRow = me === 'w' ? 0 : 7;

    const pawnAdd = (tr, tc, extra) => {
      if (tr === promoRow) {
        // ترقية: نولّد الخيارات الأربعة (الافتراضي وزير)
        for (const pr of ['Q','R','B','N'])
          add(tr, tc, { ...(extra || {}), promo: me === 'w' ? pr : pr.toLowerCase() });
      } else add(tr, tc, extra);
    };

    const one = r + dir;
    if (inside(one, c) && !b[one][c]) {
      pawnAdd(one, c);
      if (r === startRow && !b[r + 2 * dir][c]) add(r + 2 * dir, c, { double:true });
    }
    for (const dc of [-1, 1]) {
      const tr = r + dir, tc = c + dc;
      if (!inside(tr, tc)) continue;
      const q = b[tr][tc];
      if (q && colorOf(q) !== me) pawnAdd(tr, tc);
      else if (!q && st.ep && st.ep[0] === tr && st.ep[1] === tc) add(tr, tc, { ep:true });
    }
  }
  else if (type === 'N') step(DIRS.N);
  else if (type === 'B') slide(DIRS.B);
  else if (type === 'R') slide(DIRS.R);
  else if (type === 'Q') slide(DIRS.R.concat(DIRS.B));
  else if (type === 'K') {
    step(DIRS.R.concat(DIRS.B));

    // التبييت
    const home = me === 'w' ? 7 : 0;
    const rook = me === 'w' ? 'R' : 'r';
    const kR = me === 'w' ? 'wK' : 'bK';
    const qR = me === 'w' ? 'wQ' : 'bQ';

    if (r === home && c === 4 && !isAttacked(b, r, c, other(me))) {
      if (st.castling[kR] && b[home][7] === rook && !b[home][5] && !b[home][6] &&
          !isAttacked(b, home, 5, other(me)) && !isAttacked(b, home, 6, other(me))) {
        add(home, 6, { castle:'K' });
      }
      if (st.castling[qR] && b[home][0] === rook && !b[home][1] && !b[home][2] && !b[home][3] &&
          !isAttacked(b, home, 3, other(me)) && !isAttacked(b, home, 2, other(me))) {
        add(home, 2, { castle:'Q' });
      }
    }
  }
  return moves;
}

/* ============================================================
   تطبيق الحركة على لوحة (نسخة جديدة)
   ============================================================ */
function applyMove(b, m) {
  const nb = b.map(row => row.slice());
  const [fr, fc] = m.from;
  const [tr, tc] = m.to;
  const p = nb[fr][fc];

  nb[fr][fc] = null;
  if (m.ep) nb[fr][tc] = null;          // أكل البيدق في الأون باسان
  nb[tr][tc] = m.promo || p;

  if (m.castle === 'K') { nb[tr][5] = nb[tr][7]; nb[tr][7] = null; }
  if (m.castle === 'Q') { nb[tr][3] = nb[tr][0]; nb[tr][0] = null; }

  return nb;
}

/* ============================================================
   الحركات القانونية (بعد استبعاد ما يترك الملك في كش)
   ============================================================ */
function legalMoves(st, r, c) {
  const p = st.board[r][c];
  if (!p) return [];
  const me = colorOf(p);
  return genMoves(st, r, c).filter(m => !inCheck(applyMove(st.board, m), me));
}

function allLegalMoves(st) {
  const res = [];
  for (let r = 0; r < 8; r++)
    for (let c = 0; c < 8; c++) {
      const p = st.board[r][c];
      if (p && colorOf(p) === st.turn) res.push(...legalMoves(st, r, c));
    }
  return res;
}

/* ============================================================
   تنفيذ الحركة وتحديث الحالة
   ============================================================ */
function makeMove(st, m) {
  const [fr, fc] = m.from;
  const [tr, tc] = m.to;
  const p = st.board[fr][fc];
  const me = colorOf(p);

  const nb = applyMove(st.board, m);
  const castling = { ...st.castling };

  if (p.toUpperCase() === 'K') {
    if (me === 'w') { castling.wK = castling.wQ = false; }
    else            { castling.bK = castling.bQ = false; }
  }
  // تحرّك رخ
  if (fr === 7 && fc === 0) castling.wQ = false;
  if (fr === 7 && fc === 7) castling.wK = false;
  if (fr === 0 && fc === 0) castling.bQ = false;
  if (fr === 0 && fc === 7) castling.bK = false;
  // أكل رخ
  if (tr === 7 && tc === 0) castling.wQ = false;
  if (tr === 7 && tc === 7) castling.wK = false;
  if (tr === 0 && tc === 0) castling.bQ = false;
  if (tr === 0 && tc === 7) castling.bK = false;

  let ep = null;
  if (p.toUpperCase() === 'P' && Math.abs(tr - fr) === 2) ep = [(fr + tr) / 2, fc];

  return { board: nb, turn: other(me), castling, ep };
}

/* ============================================================
   الواجهة
   ============================================================ */
const boardEl  = document.getElementById('board');
const statusEl = document.getElementById('status');

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const sq = document.createElement('div');
      sq.className = 'sq ' + (((r + c) % 2 === 0) ? 'light' : 'dark');

      const p = state.board[r][c];
      if (p) {
        sq.textContent = GLYPH[p.toUpperCase()];
        sq.classList.add(colorOf(p));
      }

      if (sel && sel[0] === r && sel[1] === c) sq.classList.add('sel');

      const target = legal.find(m => m.to[0] === r && m.to[1] === c);
      if (target) sq.classList.add((p || target.ep) ? 'capture' : 'move');

      sq.addEventListener('click', () => onSquareClick(r, c));
      boardEl.appendChild(sq);
    }
  }
  updateStatus();
}

function updateStatus() {
  const me = state.turn;
  const moves = allLegalMoves(state);
  const check = inCheck(state.board, me);

  if (moves.length === 0) {
    gameOver = true;
    statusEl.textContent = check
      ? (me === 'w' ? 'كش مات! 🏆 فاز الأسود' : 'كش مات! 🏆 فاز الأبيض')
      : 'تعادل — ستاليميت (الملك ليس في كش ولا توجد حركات)';
    return;
  }
  statusEl.textContent = (me === 'w' ? 'دور الأبيض' : 'دور الأسود') + (check ? ' — كش!' : '');
}

function onSquareClick(r, c) {
  if (gameOver) return;

  if (sel) {
    const m = legal.find(x => x.to[0] === r && x.to[1] === c);
    if (m) {
      // لو فيه ترقية، نختار الوزير تلقائيًا (أول خيار)
      state = makeMove(state, m);
      sel = null;
      legal = [];
      render();
      return;
    }
  }

  const p = state.board[r][c];
  if (p && colorOf(p) === state.turn) {
    sel = [r, c];
    legal = legalMoves(state, r, c);
  } else {
    sel = null;
    legal = [];
  }
  render();
}

function reset() {
  state = freshState();
  sel = null;
  legal = [];
  gameOver = false;
  render();
}

document.getElementById('reset').addEventListener('click', reset);
reset();
</script>
</body>
</html>
