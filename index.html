<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تكسي أحمد</title>
    
    <!-- استدعاء خط تجوال (Tajawal) لجمالية النصوص العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- استدعاء مكتبة الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary-yellow: #F5C518;
            --dark-color: #1A1A1A;
            --gray-light: #E5E5E5;
            --text-gray: #666;
            --bg-color: #FAFAFA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: #000; /* خلفية سوداء للمحيط */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* حاوية التطبيق بمقاس الهاتف */
        .app-container {
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 900px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ================= الهيدر ================= */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 20px;
            z-index: 10;
        }

        .menu-btn, .bell-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--dark-color);
            cursor: pointer;
            position: relative;
        }

        .bell-btn .badge {
            position: absolute;
            top: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background-color: #FF3B30;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
        }

        /* ================= الشعار والنصوص ================= */
        .branding {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 10px;
            z-index: 10;
        }

        /* تصميم الشعار (الدائرة والسيارة) بـ CSS و SVG */
        .logo-container {
            position: relative;
            width: 150px;
            height: 120px;
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }

        .logo-circle {
            width: 100px;
            height: 100px;
            border: 8px solid var(--primary-yellow);
            border-radius: 50%;
            position: absolute;
            top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
            z-index: 2;
        }

        .logo-circle i {
            font-size: 40px;
            color: var(--dark-color);
            margin-top: -5px;
        }

        .logo-swoosh {
            position: absolute;
            bottom: 10px;
            width: 140px;
            height: 40px;
            border-bottom: 6px solid var(--dark-color);
            border-radius: 50%;
            transform: rotate(-10deg);
            z-index: 3;
        }
        
        .logo-swoosh::after {
            content: '';
            position: absolute;
            bottom: -12px;
            left: 10px;
            width: 100%;
            height: 20px;
            border-bottom: 4px solid var(--primary-yellow);
            border-radius: 50%;
        }

        .brand-title {
            font-size: 42px;
            font-weight: 900;
            color: var(--dark-color);
            display: flex;
            gap: 8px;
            line-height: 1;
            margin-top: -15px;
            z-index: 10;
        }

        .brand-title span {
            color: var(--primary-yellow);
        }

        .brand-subtitle {
            display: flex;
            align-items: center;
            gap: 15px;
            color: var(--text-gray);
            font-weight: 700;
            font-size: 15px;
            margin-top: 15px;
            z-index: 10;
        }

        .brand-subtitle::before,
        .brand-subtitle::after {
            content: "";
            height: 1px;
            width: 40px;
            background-color: #ccc;
        }

        /* ================= صورة السيارة والخلفية ================= */
        .hero-section {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            margin-top: 20px;
            z-index: 5;
        }

        /* خلفية المدينة (تدرج رمادي) */
        .city-skyline {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 50" preserveAspectRatio="none"><path d="M0,50 L0,30 L5,30 L10,20 L15,30 L20,28 L25,35 L30,25 L35,30 L40,10 L45,30 L50,20 L55,30 L60,15 L65,30 L70,25 L75,30 L80,20 L85,30 L90,25 L95,30 L100,30 L100,50 Z" fill="%23e0e0e0"/></svg>') no-repeat bottom;
            background-size: cover;
            z-index: 1;
        }

        /* صورة السيارة */
        .taxi-image {
            width: 90%;
            max-width: 380px;
            position: relative;
            z-index: 2;
            margin-bottom: -10px;
            filter: drop-shadow(0px 20px 15px rgba(0,0,0,0.3));
        }

        /* ================= الأزرار ================= */
        .actions-section {
            padding: 20px;
            padding-bottom: 90px; /* مساحة للموجات السفلية */
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            height: 65px;
            border-radius: 35px;
            padding: 0 25px;
            font-size: 18px;
            font-weight: 700;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            border: none;
            cursor: pointer;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-primary {
            background-color: var(--primary-yellow);
            color: var(--dark-color);
            box-shadow: 0 10px 20px rgba(245, 197, 24, 0.3);
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--dark-color);
            border: 2px solid var(--gray-light);
        }

        .btn-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .btn-icon {
            font-size: 22px;
        }

        .btn-arrow {
            font-size: 20px;
            color: var(--dark-color);
        }

        .btn-primary .btn-arrow {
            color: var(--dark-color);
        }

        .divider {
            width: 1px;
            height: 25px;
            background-color: rgba(0,0,0,0.15);
        }

        .btn-secondary .divider {
            background-color: var(--gray-light);
        }

        /* ================= الموجات السفلية ================= */
        .bottom-waves {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 120px;
            z-index: 1;
            pointer-events: none;
        }

        .wave-yellow {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: var(--primary-yellow);
            clip-path: ellipse(150% 100% at 50% 100%);
            transform: translateY(15px);
        }

        .wave-black {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: var(--dark-color);
            clip-path: ellipse(150% 100% at 50% 100%);
            transform: translateY(45px);
        }

    </style>
</head>
<body>

    <div class="app-container">

        <!-- الهيدر -->
        <header class="header">
            <button class="menu-btn"><i class="fa-solid fa-bars"></i></button>
            <button class="bell-btn">
                <i class="fa-regular fa-bell"></i>
                <span class="badge"></span>
            </button>
        </header>

        <!-- الشعار -->
        <div class="branding">
            <div class="logo-container">
                <div class="logo-circle">
                    <i class="fa-solid fa-taxi"></i>
                </div>
                <div class="logo-swoosh"></div>
            </div>
            <div class="brand-title">
                تكسي <span>أحمد</span>
            </div>
            <div class="brand-subtitle">
                أسرع .. آمن .. أوصلك بكل سهولة
            </div>
        </div>

        <!-- صورة السيارة -->
        <div class="hero-section">
            <div class="city-skyline"></div>
            <!-- استبدل الرابط أدناه بصورة السيارة الحقيقية (PNG بخلفية شفافة) -->
            <img src="https://www.pngplay.com/wp-content/uploads/6/Yellow-Taxi-PNG-Image-Background.png" alt="Taxi" class="taxi-image">
        </div>

        <!-- الأزرار -->
        <div class="actions-section">
            
            <!-- زر طلب تاكسي -->
            <button class="btn btn-primary" onclick="alert('جاري فتح شاشة طلب تاكسي...')">
                <div class="btn-content">
                    <i class="fa-solid fa-location-dot btn-icon"></i>
                    <div class="divider"></div>
                    <span>اطلب تاكسي</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </button>

            <!-- زر تسجيل الدخول -->
            <button class="btn btn-secondary" onclick="alert('جاري فتح شاشة تسجيل الدخول...')">
                <div class="btn-content">
                    <i class="fa-solid fa-user btn-icon"></i>
                    <div class="divider"></div>
                    <span>تسجيل الدخول</span>
                </div>
                <i class="fa-solid fa-chevron-left btn-arrow"></i>
            </button>

        </div>

        <!-- الموجات السفلية -->
        <div class="bottom-waves">
            <div class="wave-yellow"></div>
            <div class="wave-black"></div>
        </div>

    </div>

</body>
</html>
