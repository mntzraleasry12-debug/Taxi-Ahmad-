
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart 3D Book</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#101827;color:white;
font-family:Arial,sans-serif
}
header{
background:#142c4c;padding:20px;
text-align:center;border-bottom:2px solid #32aaff
}
header h1{color:#55c5ff;margin:0}
nav{
display:flex;justify-content:center;
gap:10px;padding:15px;flex-wrap:wrap
}
button{
border:0;padding:12px 18px;
background:#1678d5;color:white;
border-radius:10px;font-size:15px;
cursor:pointer
}
button:active{transform:scale(.96)}
.section{display:none;padding:15px}
.active{display:block}
.book{
background:#fff;color:#222;
max-width:600px;min-height:330px;
margin:20px auto;padding:25px;
border-radius:12px;
box-shadow:0 10px 30px #0008;
animation:flip .4s
}
@keyframes flip{
from{opacity:.3;transform:rotateY(30deg)}
to{opacity:1;transform:rotateY(0)}
}
.book h2{color:#126cc0}
.book p{font-size:18px;line-height:2}
.number{text-align:center;color:#777}
.center{text-align:center;margin:15px}
.panel{
max-width:700px;margin:auto;
background:#1b304a;padding:18px;
border-radius:15px
}
.materials{
display:grid;grid-template-columns:repeat(3,1fr);
gap:10px
}
.material{
background:#294768;padding:15px 5px;
border:2px solid transparent
}
.material.selected{border-color:#45d5ff}
.material span{display:block;font-size:25px}
#scene{
width:100%;height:300px;
background:#071629;border-radius:12px;
overflow:hidden;margin:15px 0
}
#scene canvas{display:block}
#result{
background:#102239;padding:15px;
border-radius:10px;line-height:2;
margin-top:15px
}
.formula{
direction:ltr;text-align:center;
color:#52d5ff;font-size:19px
}
footer{text-align:center;padding:20px;color:#aaa}
</style>
</head>
<body>

<header>
<h1>📚 Smart 3D Book</h1>
<p>الكتاب المدرسي الذكي ثلاثي الأبعاد</p>
</header>

<nav>
<button onclick="openPage('book')">📖 الكتاب</button>
<button onclick="openPage('lab')">🧪 المختبر</button>
<button onclick="openPage('about')">ℹ️ المشروع</button>
</nav>

<!-- BOOK -->

<section id="book" class="section active">

<div class="book">
<h2 id="title"></h2>
<p id="content"></p>
<div id="example"></div>
<div class="number">
الصفحة <span id="number"></span> / 5
</div>
</div>

<div class="center">
<button onclick="previous()">❮ السابقة</button>
<button onclick="next()">التالية ❯</button>
</div>

<div class="center">
<button onclick="openPage('lab')">
🧪 ابدأ التجربة الافتراضية
</button>
</div>

</section>

<!-- LAB -->

<section id="lab" class="section">

<div class="panel">
<h2>🧪 المختبر الكيميائي</h2>
<p>اختر مادتين لإجراء محاكاة تعليمية.</p>

<div class="materials">

<button class="material" onclick="choose('water',this)">
<span>💧</span>الماء
</button>

<button class="material" onclick="choose('vinegar',this)">
<span>🧴</span>الخل
</button>

<button class="material" onclick="choose('baking',this)">
<span>🧂</span>بيكربونات الصوديوم
</button>

</div>

<div id="scene"></div>

<div class="center">
<button onclick="experiment()">⚗️ ابدأ التفاعل</button>
<button onclick="resetLab()">🔄 إعادة</button>
</div>

<div id="result">
اختر مادتين لبدء التجربة.
</div>

</div>
</section>

<section id="about" class="section">
<div class="panel">
<h2>عن Smart 3D Book</h2>
<p>مشروع لتحويل الكتب المدرسية التقليدية إلى بيئة تعليمية تفاعلية ثلاثية الأبعاد.</p>
<p>اقرأ، شاهد، جرّب، وتعلّم.</p>
</div>
</section>

<footer>SMART 3D BOOK - 2026</footer>

<script>

// صفحات الكتاب

const pages=[
{
title:"مقدمة في الكيمياء",
content:"الكيمياء علم يدرس المادة وخصائصها والتغيرات التي تحدث لها.",
example:"مرحباً بك في عالم العلوم التفاعلي."
},
{
title:"المادة",
content:"المادة هي كل شيء له كتلة ويشغل حيزاً من الفراغ.",
example:"تتكون المواد من الذرات والجزيئات."
},
{
title:"التفاعلات الكيميائية",
content:"التفاعل الكيميائي هو تحول مواد متفاعلة إلى مواد جديدة.",
example:"يمكنك مشاهدة محاكاة التفاعلات داخل المختبر."
},
{
title:"قوانين الفيزياء",
content:"تدرس الفيزياء الحركة والقوة والطاقة والضوء والكهرباء.",
example:"سنضيف تجارب فيزيائية ثلاثية الأبعاد لاحقاً."
},
{
title:"المختبر الافتراضي",
content:"هنا تستطيع إجراء تجارب افتراضية والتعرف على نتائجها.",
example:"اضغط على زر المختبر للبدء."
}
];

let page=0;

function display(){
let p=pages[page];
document.getElementById("title").textContent=p.title;
document.getElementById("content").textContent=p.content;
document.getElementById("example").textContent=p.example;
document.getElementById("number").textContent=page+1;
}

function next(){
if(page<pages.length-1)page++;
display();
}

function previous(){
if(page>0)page--;
display();
}

function openPage(id){
document.querySelectorAll(".section").forEach(s=>{
s.classList.remove("active");
});
document.getElementById(id).classList.add("active");

if(id==="lab"){
setTimeout(resizeScene,100);
}
}

// المواد الكيميائية

let selected=[];

const materialNames={
water:"الماء",
vinegar:"الخل",
baking:"بيكربونات الصوديوم"
};

function choose(type,button){

if(selected.includes(type)){
selected=selected.filter(x=>x!==type);
button.classList.remove("selected");
}else{
if(selected.length>=2)return;
selected.push(type);
button.classList.add("selected");
}

document.getElementById("result").textContent=
selected.map(x=>materialNames[x]).join(" + ") || "اختر مادتين.";
}

// محرك 3D

let scene,camera,renderer,liquid;
let bubbles=[];
let running=false;

function createScene(){

const area=document.getElementById("scene");

scene=new THREE.Scene();
scene.background=new THREE.Color(0x071629);

camera=new THREE.PerspectiveCamera(
45,area.clientWidth/300,.1,100
);

camera.position.set(0,2.5,7);
camera.lookAt(0,1,0);

renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(area.clientWidth,300);
area.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.5));

let light=new THREE.PointLight(0xffffff,2);
light.position.set(3,5,5);
scene.add(light);

// الأرضية

let floor=new THREE.Mesh(
new THREE.PlaneGeometry(10,10),
new THREE.MeshStandardMaterial({color:0x18314b})
);
floor.rotation.x=-Math.PI/2;
scene.add(floor);

// الكأس الزجاجي

let glass=new THREE.Mesh(
new THREE.CylinderGeometry(.8,.65,2,32,1,true),
new THREE.MeshPhysicalMaterial({
color:0x9bdfff,transparent:true,
opacity:.3,side:THREE.DoubleSide
})
);
glass.position.y=1;
scene.add(glass);

// السائل

liquid=new THREE.Mesh(
new THREE.CylinderGeometry(.62,.62,.45,32),
new THREE.MeshStandardMaterial({
color:0x238bff,
transparent:true,opacity:.8
})
);
liquid.position.y=.35;
scene.add(liquid);

// فقاعات

for(let i=0;i<25;i++){
let b=new THREE.Mesh(
new THREE.SphereGeometry(.06,12,12),
new THREE.MeshStandardMaterial({
color:0xffffff,transparent:true,opacity:.8
})
);
b.position.set(
(Math.random()-.5)*.8,
Math.random()*1.5,
(Math.random()-.5)*.5
);
b.visible=false;
scene.add(b);
bubbles.push(b);
}

animate();
}

function animate(){
requestAnimationFrame(animate);

if(running){
bubbles.forEach(b=>{
if(b.visible){
b.position.y+=.025;
if(b.position.y>2)b.position.y=.2;
}
});
}

if(renderer)renderer.render(scene,camera);
}

function resizeScene(){
if(!renderer)return;
let area=document.getElementById("scene");
renderer.setSize(area.clientWidth,300);
camera.aspect=area.clientWidth/300;
camera.updateProjectionMatrix();
}

// التجارب

function experiment(){

if(selected.length!==2){
document.getElementById("result").textContent=
"يجب اختيار مادتين أولاً.";
return;
}

let combo=[...selected].sort().join("+");

if(combo==="baking+vinegar"){

liquid.material.color.set(0x55baff);
bubbles.forEach(b=>b.visible=true);
running=true;

document.getElementById("result").innerHTML=`
<h3>🫧 نتيجة المحاكاة</h3>
<p>ينتج عن تفاعل الخل مع بيكربونات الصوديوم غاز ثاني أكسيد الكربون.</p>
<div class="formula">
CH₃COOH + NaHCO₃ → CH₃COONa + H₂O + CO₂
</div>
<p>الفقاعات تمثل الغاز الناتج عن التفاعل.</p>
<p>هذه محاكاة تعليمية وليست تجربة مخبرية حقيقية.</p>
`;

}else if(combo==="water+vinegar"){

stopBubbles();
liquid.material.color.set(0x8bcaff);

document.getElementById("result").innerHTML=`
<h3>💧 نتيجة المحاكاة</h3>
<p>يمتزج الماء مع الخل لتكوين محلول مخفف.</p>
<p>لا يظهر تفاعل كيميائي واضح.</p>
`;

}else{

stopBubbles();
liquid.material.color.set(0x8bcaff);

document.getElementById("result").innerHTML=`
<h3>🧪 نتيجة المحاكاة</h3>
<p>تذوب بيكربونات الصوديوم في الماء لتكوين محلول.</p>
<p>هذه عملية ذوبان وليست تفاعلاً ينتج عنه غاز.</p>
`;
}

}

function stopBubbles(){
running=false;
bubbles.forEach(b=>b.visible=false);
}

function resetLab(){

selected=[];
document.querySelectorAll(".material").forEach(b=>{
b.classList.remove("selected");
});

stopBubbles();
liquid.material.color.set(0x238bff);

document.getElementById("result").textContent=
"تم تنظيف المختبر. اختر مواد جديدة.";
}

display();
createScene();

window.addEventListener("resize",resizeScene);

</script>
</body>
</html>
