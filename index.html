<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFC107">
    <title>تكسي أحمد - Premium App</title>
    
    <!-- استدعاء الخطوط -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    
    <!-- استدعاء الأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- استدعاء مكتبة الخريطة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        /* =========================================
           1. المتغيرات العامة (Global Variables)
           ========================================= */
        :root {
            --primary-color: #FFC107;
            --primary-dark: #FFA000;
            --bg-color: #F8F9FA;
            --white: #FFFFFF;
            --dark: #121212;
            --text-gray: #777777;
            --light-gray: #EEEEEE;
            --success: #00C853;
            --danger: #FF3B30;
            --shadow-sm: 0 4px 10px rgba(0,0,0,0.05);
            --shadow-md: 0 8px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 15px 35px rgba(0,0,0,0.15);
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 30px;
            --transition: all 0.3s ease;
        }

        /* =========================================
           2. إعادة الضبط (Reset)
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================================
           3. حاوية التطبيق (App Container)
           ========================================= */
        .app-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            max-height: 896px;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            /* لمحاكاة شاشة الهاتف على الكمبيوتر */
            border-radius: 0; 
        }

        @media (min-width: 450px) {
            .app-container {
                border-radius: 40px;
                border: 8px solid #333;
                height: 90vh;
            }
        }

        /* =========================================
           4. شاشة تسجيل الدخول (Login Screen)
           ========================================= */
        #login-screen {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #111 0%, #2a2a2a 100%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            transition: transform 0.6s cubic-bezier(0.77, 0, 0.175, 1);
        }

        #login-screen.hidden {
            transform: translateY(-100%);
        }

        .login-header {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .glow {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--primary-color);
            filter: blur(100px);
            opacity: 0.2;
            border-radius: 50%;
        }

        .brand-title {
            font-size: 45px;
            font-weight: 900;
            color: var(--white);
            z-index: 2;
        }

        .brand-title span {
            color: var(--primary-color);
        }

        .brand-subtitle {
            font-size: 15px;
            color: #888;
            margin-top: 5px;
            z-index: 2;
        }

        .login-form {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px 40px 0 0;
            padding: 30px 25px 40px;
            z-index: 2;
        }

        .role-toggle {
            display: flex;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 5px;
            margin-bottom: 25px;
        }

        .role-btn {
            flex: 1;
            padding: 14px;
            border: none;
            background: transparent;
            color: #888;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
        }

        .role-btn.active {
            background: var(--primary-color);
            color: var(--dark);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.3);
        }

        .input-box {
            position: relative;
            margin-bottom: 15px;
        }

        .input-box i {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-color);
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 18px 50px 18px 20px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            color: var(--white);
            font-size: 15px;
            outline: none;
            transition: var(--transition);
        }

        .input-box input:focus {
            border-color: var(--primary-color);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: var(--primary-color);
            color: var(--dark);
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 900;
            margin-top: 10px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 193, 7, 0.4);
            transition: var(--transition);
        }

        .btn-submit:active {
            transform: scale(0.96);
        }

        /* =========================================
           5. الشاشات الأساسية (Main Dashboards)
           ========================================= */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            background: var(--bg-color);
        }

        .screen.active {
            display: flex;
        }

        /* =========================================
           6. واجهة الزبون (Customer Screen)
           ========================================= */
        #customer-screen {
            background: var(--white);
        }

        /* الهيدر */
        .customer-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 100;
            pointer-events: none; /* ليتم النقر على الخريطة من تحته */
        }

        .header-logo {
            font-size: 28px;
            font-weight: 900;
            color: var(--dark);
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }
        
        .header-logo span {
            color: var(--primary-color);
            text-shadow: 0 2px 10px rgba(255,255,255,0.8);
        }

        .header-actions {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }

        .icon-btn {
            width: 45px;
            height: 45px;
            background: var(--white);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: var(--shadow-md);
            font-size: 18px;
            color: var(--dark);
            position: relative;
            cursor: pointer;
        }

        .badge {
            position: absolute;
            top: -2px;
            right: -2px;
            background: var(--danger);
            color: var(--white);
            width: 18px;
            height: 18px;
            border-radius: 50%;
            font-size: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid var(--white);
        }

        /* الخريطة */
        #map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* بطاقة الموقع العائمة */
        .location-card {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--white);
            padding: 12px 20px;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: var(--shadow-md);
            z-index: 10;
            width: 85%;
            cursor: pointer;
        }

        .location-card i.fa-location-dot {
            font-size: 22px;
            color: var(--dark);
        }

        .location-info {
            flex: 1;
        }

        .location-info h4 {
            font-size: 15px;
            font-weight: 800;
            color: var(--dark);
        }

        .location-info p {
            font-size: 12px;
            color: var(--text-gray);
            margin-top: 2px;
        }

        .location-card i.fa-chevron-left {
            color: var(--text-gray);
            font-size: 14px;
        }

        /* المحتوى السفلي */
        .customer-bottom-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            border-radius: 30px 30px 0 0;
            padding: 20px;
            padding-bottom: 80px; /* مساحة للشريط السفلي */
            z-index: 100;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
        }

        /* شبكة الخدمات */
        .services-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .service-card {
            background: var(--white);
            border: 1px solid var(--light-gray);
            border-radius: var(--radius-md);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .service-card:active {
            transform: scale(0.97);
            background: #f9f9f9;
        }

        /* الشارة الصفراء الصغيرة في أعلى البطاقة */
        .service-badge {
            position: absolute;
            top: -8px;
            right: 50%;
            transform: translateX(50%);
            background: var(--primary-color);
            color: var(--dark);
            font-size: 9px;
            font-weight: 900;
            padding: 2px 10px;
            border-radius: 10px;
            letter-spacing: 1px;
        }

        .service-img {
            width: 45px;
            height: 45px;
            object-fit: contain;
        }

        .service-icon {
            width: 45px;
            height: 45px;
            background: #FFF8E1;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            color: var(--primary-dark);
        }

        .service-text h4 {
            font-size: 14px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 3px;
        }

        .service-text p {
            font-size: 10px;
            color: var(--text-gray);
            font-weight: 500;
        }

        /* البانر الترويجي */
        .promo-banner {
            background: #111;
            border-radius: var(--radius-md);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            overflow: hidden;
            height: 90px;
        }

        .banner-shape {
            position: absolute;
            left: 0;
            top: 0;
            width: 45%;
            height: 100%;
            background: linear-gradient(to right, var(--primary-color), transparent);
            clip-path: polygon(0 0, 100% 0, 70% 100%, 0 100%);
            opacity: 0.9;
            z-index: 1;
        }

        .banner-content {
            position: relative;
            z-index: 2;
            color: var(--white);
            text-align: right;
            margin-right: auto;
        }

        .banner-content h3 {
            font-size: 15px;
            font-weight: 800;
            line-height: 1.4;
        }

        .banner-content span {
            color: var(--primary-color);
        }

        .banner-content p {
            font-size: 11px;
            color: #aaa;
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .banner-skyline {
            position: relative;
            z-index: 2;
            font-size: 40px;
            color: rgba(255,255,255,0.1);
        }

        /* شريط التنقل السفلي */
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
            border-top: 1px solid var(--light-gray);
            z-index: 200;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            color: var(--text-gray);
            font-size: 11px;
            font-weight: 700;
            text-decoration: none;
            transition: var(--transition);
        }

        .nav-item i {
            font-size: 20px;
        }

        .nav-item.active {
            color: var(--primary-dark);
        }

        /* =========================================
           7. واجهة السائق (Driver Screen)
           ========================================= */
        #driver-screen {
            background: #0a0a0a;
            color: var(--white);
        }

        .driver-header {
            padding: 40px 25px 30px;
            background: linear-gradient(to bottom, #1A1A1A, #0a0a0a);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 0 0 30px 30px;
        }

        .driver-info h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .driver-info p {
            font-size: 14px;
            color: var(--text-gray);
        }

        .toggle-switch {
            width: 60px;
            height: 32px;
            background: #333;
            border-radius: 20px;
            position: relative;
            cursor: pointer;
            transition: var(--transition);
        }

        .toggle-switch::after {
            content: '';
            position: absolute;
            width: 24px;
            height: 24px;
            background: var(--white);
            border-radius: 50%;
            top: 4px;
            right: 4px;
            transition: var(--transition);
        }

        .toggle-switch.on {
            background: var(--success);
            box-shadow: 0 0 15px rgba(0, 200, 83, 0.4);
        }

        .toggle-switch.on::after {
            right: 32px;
        }

        .driver-content {
            padding: 25px;
            flex: 1;
            overflow-y: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1A1A1A;
            padding: 20px;
            border-radius: var(--radius-md);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .stat-card h4 {
            font-size: 13px;
            color: var(--text-gray);
            margin-bottom: 8px;
        }

        .stat-card h2 {
            font-size: 24px;
            color: var(--primary-color);
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .request-card {
            background: #1A1A1A;
            border-radius: var(--radius-md);
            padding: 20px;
            margin-bottom: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            position: relative;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .request-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-weight: 800;
        }

        .request-price {
            color: var(--success);
            background: rgba(0, 200, 83, 0.1);
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 16px;
        }

        .request-location {
            font-size: 14px;
            color: var(--text-gray);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .request-location i {
            color: var(--primary-color);
            width: 15px;
            text-align: center;
        }

        .btn-accept {
            width: 100%;
            padding: 15px;
            background: var(--white);
            color: var(--dark);
            border: none;
            border-radius: var(--radius-sm);
            font-weight: 800;
            font-size: 16px;
            margin-top: 15px;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-accept:active {
            transform: scale(0.97);
        }

        .btn-accept.accepted {
            background: var(--success);
            color: var(--white);
        }

        /* =========================================
           8. النوافذ المنبثقة (Modals)
           ========================================= */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: flex-end;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 414px;
            background: var(--white);
            border-radius: 30px 30px 0 0;
            padding: 30px 20px;
            animation: slideUpModal 0.3s ease;
        }

        @keyframes slideUpModal {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 5px;
            background: #ccc;
